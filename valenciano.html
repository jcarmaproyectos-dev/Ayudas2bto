ll.","infinitive":"fer","conjugation":"2","person":"3","personLabel":"3a persona del singular","conjugationLabel":"2a conjugació"},{"id":"v047","sentence":"Caldria que els alumnes {llegiren} la novel·la.","tense":"Imperfet","mode":"Subjuntiu","aspect":"Imperfectiu","explanation":"Imperfet de subjuntiu: forma simple que expressa una situació hipotètica o subordinada, sense anterioritat completada. El verb principal és llegir (3a conjugació); la forma marcada correspon a la 3a persona del plural.","answer":"Imperfet · Imperfectiu · Subjuntiu · 3a conjugació · 3a persona del plural","prompt":"Caldria que els alumnes llegiren la novel·la.","infinitive":"llegir","conjugation":"3","person":"6","personLabel":"3a persona del plural","conjugationLabel":"3a conjugació"},{"id":"v048","sentence":"Espere que tu {hages acabat} el resum.","tense":"Perfet","mode":"Subjuntiu","aspect":"Perfectiu","explanation":"Haver en present de subjuntiu + participi: perfet de subjuntiu, amb aspecte perfectiu. El verb principal és acabar (1a conjugació); la forma marcada correspon a la 2a persona del singular.","answer":"Perfet · Perfectiu · Subjuntiu · 1a conjugació · 2a persona del singular","prompt":"Espere que tu hages acabat el resum.","infinitive":"acabar","conjugation":"1","person":"2","personLabel":"2a persona del singular","conjugationLabel":"1a conjugació"},{"id":"v049","sentence":"És possible que ella {haja eixit}.","tense":"Perfet","mode":"Subjuntiu","aspect":"Perfectiu","explanation":"Haver en present de subjuntiu + participi: perfet de subjuntiu, amb aspecte perfectiu. El verb principal és eixir (3a conjugació); la forma marcada correspon a la 3a persona del singular.","answer":"Perfet · Perfectiu · Subjuntiu · 3a conjugació · 3a persona del singular","prompt":"És possible que ella haja eixit.","infinitive":"eixir","conjugation":"3","person":"3","personLabel":"3a persona del singular","conjugationLabel":"3a conjugació"},{"id":"v050","sentence":"M’alegra que vosaltres {hàgeu vingut}.","tense":"Perfet","mode":"Subjuntiu","aspect":"Perfectiu","explanation":"Haver en present de subjuntiu + participi: perfet de subjuntiu, amb aspecte perfectiu. El verb principal és vindre (2a conjugació); la forma marcada correspon a la 2a persona del plural. L’AVL l’inclou en la segona conjugació.","answer":"Perfet · Perfectiu · Subjuntiu · 2a conjugació · 2a persona del plural","prompt":"M’alegra que vosaltres hàgeu vingut.","infinitive":"vindre","conjugation":"2","person":"5","personLabel":"2a persona del plural","conjugationLabel":"2a conjugació"},{"id":"v051","sentence":"Dubte que ells {hagen llegit} tot el llibre.","tense":"Perfet","mode":"Subjuntiu","aspect":"Perfectiu","explanation":"Haver en present de subjuntiu + participi: perfet de subjuntiu, amb aspecte perfectiu. El verb principal és llegir (3a conjugació); la forma marcada correspon a la 3a persona del plural.","answer":"Perfet · Perfectiu · Subjuntiu · 3a conjugació · 3a persona del plural","prompt":"Dubte que ells hagen llegit tot el llibre.","infinitive":"llegir","conjugation":"3","person":"6","personLabel":"3a persona del plural","conjugationLabel":"3a conjugació"},{"id":"v052","sentence":"Si tu {hagueres estudiat}, ho sabries.","tense":"Plusquamperfet","mode":"Subjuntiu","aspect":"Perfectiu","explanation":"Haver en imperfet de subjuntiu + participi: plusquamperfet de subjuntiu, amb aspecte perfectiu. El verb principal és estudiar (1a conjugació); la forma marcada correspon a la 2a persona del singular.","answer":"Plusquamperfet · Perfectiu · Subjuntiu · 1a conjugació · 2a persona del singular","prompt":"Si tu hagueres estudiat, ho sabries.","infinitive":"estudiar","conjugation":"1","person":"2","personLabel":"2a persona del singular","conjugationLabel":"1a conjugació"},{"id":"v053","sentence":"Volia que nosaltres ja {haguérem acabat}.","tense":"Plusquamperfet","mode":"Subjuntiu","aspect":"Perfectiu","explanation":"Haver en imperfet de subjuntiu + participi: plusquamperfet de subjuntiu, amb aspecte perfectiu. El verb principal és acabar (1a conjugació); la forma marcada correspon a la 1a persona del plural.","answer":"Plusquamperfet · Perfectiu · Subjuntiu · 1a conjugació · 1a persona del plural","prompt":"Volia que nosaltres ja haguérem acabat.","infinitive":"acabar","conjugation":"1","person":"4","personLabel":"1a persona del plural","conjugationLabel":"1a conjugació"},{"id":"v054","sentence":"Si Laia {haguera vingut}, l’hauríem vista.","tense":"Plusquamperfet","mode":"Subjuntiu","aspect":"Perfectiu","explanation":"Haver en imperfet de subjuntiu + participi: plusquamperfet de subjuntiu, amb aspecte perfectiu. El verb principal és vindre (2a conjugació); la forma marcada correspon a la 3a persona del singular. L’AVL l’inclou en la segona conjugació.","answer":"Plusquamperfet · Perfectiu · Subjuntiu · 2a conjugació · 3a persona del singular","prompt":"Si Laia haguera vingut, l’hauríem vista.","infinitive":"vindre","conjugation":"2","person":"3","personLabel":"3a persona del singular","conjugationLabel":"2a conjugació"},{"id":"v055","sentence":"Hauria preferit que ells {hagueren telefonat}.","tense":"Plusquamperfet","mode":"Subjuntiu","aspect":"Perfectiu","explanation":"Haver en imperfet de subjuntiu + participi: plusquamperfet de subjuntiu, amb aspecte perfectiu. El verb principal és telefonar (1a conjugació); la forma marcada correspon a la 3a persona del plural.","answer":"Plusquamperfet · Perfectiu · Subjuntiu · 1a conjugació · 3a persona del plural","prompt":"Hauria preferit que ells hagueren telefonat.","infinitive":"telefonar","conjugation":"1","person":"6","personLabel":"3a persona del plural","conjugationLabel":"1a conjugació"},{"id":"v056","sentence":"Vosaltres, {tanqueu} la porta, per favor.","tense":"Present","mode":"Imperatiu","aspect":"Imperfectiu","explanation":"Imperatiu afirmatiu: en esta pràctica es classifica com a present i imperfectiu. El verb principal és tancar (1a conjugació); la forma marcada correspon a la 2a persona del plural.","answer":"Present · Imperfectiu · Imperatiu · 1a conjugació · 2a persona del plural","prompt":"Vosaltres, tanqueu la porta, per favor.","infinitive":"tancar","conjugation":"1","person":"5","personLabel":"2a persona del plural","conjugationLabel":"1a conjugació"},{"id":"v057","sentence":"Tu, {vine} ací ara mateix.","tense":"Present","mode":"Imperatiu","aspect":"Imperfectiu","explanation":"Imperatiu afirmatiu: en esta pràctica es classifica com a present i imperfectiu. El verb principal és vindre (2a conjugació); la forma marcada correspon a la 2a persona del singular. L’AVL l’inclou en la segona conjugació.","answer":"Present · Imperfectiu · Imperatiu · 2a conjugació · 2a persona del singular","prompt":"Tu, vine ací ara mateix.","infinitive":"vindre","conjugation":"2","person":"2","personLabel":"2a persona del singular","conjugationLabel":"2a conjugació"},{"id":"v058","sentence":"Per favor, {llegiu} el text en veu alta.","tense":"Present","mode":"Imperatiu","aspect":"Imperfectiu","explanation":"Imperatiu afirmatiu: en esta pràctica es classifica com a present i imperfectiu. El verb principal és llegir (3a conjugació); la forma marcada correspon a la 2a persona del plural.","answer":"Present · Imperfectiu · Imperatiu · 3a conjugació · 2a persona del plural","prompt":"Per favor, llegiu el text en veu alta.","infinitive":"llegir","conjugation":"3","person":"5","personLabel":"2a persona del plural","conjugationLabel":"3a conjugació"},{"id":"v059","sentence":"Tu, {fes} el resum ara.","tense":"Present","mode":"Imperatiu","aspect":"Imperfectiu","explanation":"Imperatiu afirmatiu: en esta pràctica es classifica com a present i imperfectiu. El verb principal és fer (2a conjugació); la forma marcada correspon a la 2a persona del singular.","answer":"Present · Imperfectiu · Imperatiu · 2a conjugació · 2a persona del singular","prompt":"Tu, fes el resum ara.","infinitive":"fer","conjugation":"2","person":"2","personLabel":"2a persona del singular","conjugationLabel":"2a conjugació"}],"fragments":[{"id":"f01","title":"El nom imposat","page":14,"chapter":"I","part":"Identitat i alteritat","text":"Quan el vals es va acabar la gent va començar a sortir. Jo vaig dir que havia perdut la Julieta i aquell noi va dir que ell havia perdut en Cintet i va dir, quan estarem ben sols, tota la gent desada a dintre de les cases i els carrers buits, vostè i jo ballarem un vals de punta a la plaça del Diamant… volta que volta… Colometa. Me’l vaig mirar molt amoïnada i li vaig dir que em deia Natàlia i quan li vaig dir que em deia Natàlia encara riu i va dir que jo només em podia dir un nom: Colometa.","questions":[{"id":"f01-q1","kind":"Argument i personatges","prompt":"Situa el fragment dins de l’argument i explica què anticipa el canvi de nom.","model":"El fragment pertany a l’inici de la novel·la, quan Natàlia coneix Quimet al ball de la plaça del Diamant. Encara està promesa amb Pere, però la nova relació acabarà conduint-la al matrimoni. Quimet li imposa «Colometa» malgrat que ella afirma que es diu Natàlia. El gest anticipa una relació desigual: ell pretén definir qui és ella. Aquesta pèrdua d’identitat s’accentuarà amb els coloms i les obligacions domèstiques, abans de la recuperació personal de la protagonista.","evidence":["em deia Natàlia","Colometa"],"notesPages":[7,9,10],"words":75},{"id":"f01-q2","kind":"Veu narrativa","prompt":"Descriu la veu narrativa i relaciona-la amb dos indicis del fragment.","model":"Natàlia és una narradora protagonista: conta en primera persona uns fets que ella mateixa ha viscut. Ho mostren «Jo vaig dir» i «Me’l vaig mirar». La focalització és interna i fixa, perquè només coneixem directament la seua percepció i la seua preocupació, expressada en «molt amoïnada». L’acumulació de «va dir» i la reproducció de les paraules de Quimet aporten oralitat. És una evocació retrospectiva i ordenada, pròxima al monòleg autobiogràfic, més que un flux mental completament caòtic.","evidence":["Jo vaig dir","Me’l vaig mirar","molt amoïnada"],"notesPages":[8,9,11],"words":77},{"id":"f01-q3","kind":"Tema i símbol","prompt":"Explica la relació entre la identitat i el nom de Colometa. Esmenta altres temes de l’obra.","model":"El tema central és la subordinació de la identitat femenina a l’autoritat masculina. Natàlia intenta afirmar el seu nom, però Quimet decideix que «només em podia dir un nom: Colometa». El diminutiu anticipa el món dels coloms, associat després a les càrregues que ell li imposa. Així, una escena aparentment festiva anuncia l’alienació de la protagonista. Altres temes fonamentals són la maternitat, la soledat, la supervivència durant la guerra i la reconstrucció de la vida després del dolor.","evidence":["només em podia dir un nom: Colometa"],"notesPages":[7,9,12],"words":78},{"id":"f01-q4","kind":"Context: trajectòria","prompt":"Situa La plaça del Diamant en la trajectòria de Rodoreda i diferencia el temps d’escriptura del temps narrat.","model":"Publicada el 1962, La plaça del Diamant correspon a la maduresa de Rodoreda, marcada per l’exili i la consolidació de la novel·la psicològica. Comparteix aquesta etapa amb Vint-i-dos contes i El carrer de les Camèlies. En canvi, el ball del fragment pertany al començament de la vida adulta de Natàlia, anterior a la República segons l’estructura dels apunts. «La plaça del Diamant» identifica l’escenari recordat, però no data l’escriptura: l’autora recrea des de l’exili una Barcelona anterior.","evidence":["la plaça del Diamant"],"notesPages":[4,5,7,11],"words":77}]},{"id":"f02","title":"Les balances de l’escala","page":27,"chapter":"IV","part":"Identitat i alteritat","text":"Entre el nostre replà i el del primer pis la paret estava guixada: noms i ninots. I entre els noms i els ninots hi havia unes balances molt ben dibuixades, amb les ratlles endintre de la paret com si les haguessin fetes amb la punta d’un punxó. L’un dels plats penjava una mica més avall que l’altre. I vaig passar el dit pel voltant d’un dels plats.","questions":[{"id":"f02-q1","kind":"Símbols","prompt":"Identifica el símbol del fragment i explica el seu significat en el conjunt de l’obra.","model":"Les balances dibuixades a l’escala simbolitzen la recerca d’equilibri de Natàlia. El detall que «L’un dels plats penjava una mica més avall que l’altre» presenta un objecte desigual, que es pot relacionar amb el futur matrimoni desequilibrat amb Quimet. El gest de passar-hi el dit converteix un element quotidià en un contacte íntim i recurrent. Al llarg de l’obra, les balances reapareixen en moments significatius i acompanyen la necessitat d’estabilitat i la reconstrucció personal de la protagonista.","evidence":["L’un dels plats penjava una mica més avall que l’altre","vaig passar el dit"],"notesPages":[11,12],"words":77},{"id":"f02-q2","kind":"Estil i corrent","prompt":"Relaciona la descripció d’aquest objecte amb el caràcter psicològic i poètic de la novel·la.","model":"El fragment parteix d’un detall realista de l’escala, però la mirada de Natàlia el carrega clarament de significació. Les balances no són només decoració: el desnivell dels plats suggereix una desigualtat que el lector pot relacionar amb la seua experiència. L’expressió «vaig passar el dit» mostra la vinculació sensorial amb l’objecte. Aquesta fusió entre realitat quotidiana, món interior i símbols caracteritza una novel·la psicològica que també és poètica, perquè comunica emocions a través d’imatges materials.","evidence":["vaig passar el dit","unes balances molt ben dibuixades"],"notesPages":[6,8,11,12],"words":75},{"id":"f02-q3","kind":"Espai i perspectiva","prompt":"Quins elements de realitat quotidiana apareixen? Com es relacionen amb l’espai general de l’obra?","model":"El replà, l’escala i la paret amb «noms i ninots» evoquen un edifici d’habitatges popular, coherent amb la Barcelona de Gràcia on viu Natàlia. La descripció es concentra en allò que ella veu i toca: segueix amb el dit el contorn d’un plat de les balances. No és una panoràmica neutral de la ciutat, sinó una experiència subjectiva d’un espai domèstic. El fragment no dona un any concret; permet caracteritzar l’ambient, però no precisar per si sol tota la cronologia.","evidence":["noms i ninots","Entre el nostre replà"],"notesPages":[8,11],"words":80},{"id":"f02-q4","kind":"Context: influències","prompt":"Relaciona l’atenció als objectes amb una influència literària explicada en els apunts.","model":"Els apunts relacionen l’atenció minuciosa als objectes amb Alain Robbe-Grillet i el nouveau roman. Ací la mirada s’atura en les ratlles «endintre de la paret» i en la posició desigual dels plats. Tanmateix, Rodoreda no es limita a descriure una superfície: el gest de tocar-la integra l’objecte en la vida afectiva de Natàlia. Aquesta observació detallada conviu amb la memòria subjectiva i el simbolisme, que distingeixen la seua novel·la d’una simple reproducció objectiva de l’entorn.","evidence":["endintre de la paret"],"notesPages":[6,12],"words":75}]},{"id":"f03","title":"L’aire de la República","page":63,"chapter":"XIV","part":"Els coloms i la maternitat","text":"I tot anava així, amb maldecaps petits, fins que va venir la república i en Quimet se’m va engrescar i anava pels carrers cridant i fent voleiar una bandera que mai no vaig poder saber d’on l’havia treta. Encara em recordo d’aquell aire fresc, un aire, cada vegada que me’n recordo, que no l’he pogut sentir mai més. Mai més. Barrejat amb olor de fulla tendra i amb olor de poncella, un aire que va fugir, i tots els que després van venir mai més no van ser com l’aire aquell d’aquell dia que va fer un tall en la meva vida, perquè va ser amb abril i flors tancades que els meus maldecaps petits es van començar a tornar maldecaps grossos.","questions":[{"id":"f03-q1","kind":"Temps històric","prompt":"Explica el sentit personal i col·lectiu de l’evocació de la República.","model":"La proclamació de la República és un canvi col·lectiu que Quimet viu amb entusiasme: ix al carrer cridant i amb una bandera. Natàlia, en canvi, el recorda sobretot mitjançant sensacions: «aquell aire fresc», les olors i les flors. La memòria adulta incorpora també una ombra de pèrdua, perquè insisteix que aquell aire no tornà. Per això el passatge uneix l’esperança pública amb una frontera personal: els «maldecaps petits» es transformaran en «maldecaps grossos», anunci de dificultats futures.","evidence":["aquell aire fresc","maldecaps petits","maldecaps grossos"],"notesPages":[7,8,11],"words":77},{"id":"f03-q2","kind":"Estil","prompt":"Identifica dos recursos expressius del fragment i explica la seua funció.","model":"La repetició de «Mai més» reforça la nostàlgia i la consciència que un moment esperançador s’ha perdut definitivament. Les referències a «olor de fulla tendra» i «olor de poncella» associen el record històric a una experiència sensorial i vegetal. A més, l’oposició entre maldecaps petits i grossos anticipa l’enduriment de la vida de Natàlia. Aquests recursos converteixen la història col·lectiva en memòria íntima i mostren el lirisme d’una prosa aparentment senzilla, pròxima a l’expressió oral.","evidence":["Mai més","olor de fulla tendra","olor de poncella"],"notesPages":[8,11,12],"words":75},{"id":"f03-q3","kind":"Argument","prompt":"A quina part correspon el fragment i quina relació té amb els fets posteriors?","model":"El passatge pertany al capítol XIV, dins d’«Els coloms i la maternitat», la segona part de l’estructura recollida als apunts. Natàlia ja viu amb Quimet i la narració incorpora la proclamació de la República, el 1931. L’entusiasme del marit i el record d’«aquell aire fresc» contrasten amb els problemes que després s’acumulen. La frase sobre els maldecaps anticipa l’opressió domèstica i, més endavant, la guerra i la penúria, sense que el fragment relate encara tots aquests esdeveniments.","evidence":["va venir la república","aquell aire fresc"],"notesPages":[7,8],"words":77},{"id":"f03-q4","kind":"Context: dues èpoques","prompt":"Diferencia el marc històric d’aquest fragment del context cultural en què es publica la novel·la.","model":"El fragment evoca la proclamació de la Segona República, recognoscible per «abril», l’agitació al carrer i la bandera de Quimet. La novel·la, però, es publica el 1962, en una cultura marcada per les conseqüències de la Guerra Civil: exili, repressió lingüística i censura. Als seixanta creix la infraestructura editorial catalana i es consoliden veus de postguerra. Per tant, l’esperança republicana és el temps representat; la recuperació literària sota el franquisme és el context de publicació de l’obra.","evidence":["abril","bandera"],"notesPages":[1,2,4,11],"words":77}]},{"id":"f04","title":"Una casa envaïda","page":87,"chapter":"XXI","part":"Els coloms i la maternitat","text":"Cada dia estava més cansada. Els nens, quan entrava al pis, els trobava moltes vegades adormits. Els havia estès una flassada per terra al menjador, amb dos coixins, i els trobava adormits, de vegades molt acostadets i el nen amb un braç passat damunt de la Rita. Fins que no els vaig trobar més adormits i la Rita, tan petitona, feia hiiii… hiiiii… hiiiiii… i es miraven amb el nen i el nen es posava un dit davant de la boca i li deia, calla. I la Rita tornava amb aquella mena de riure, hiiiii… hiiiii… hi… un riure molt estrany. I vaig voler saber què passava. Un dia vaig córrer més i no em vaig aturar enlloc i vaig arribar una mica més d’hora, vaig obrir la porta del pis com si entrés a robar, aguantant-me la respiració mentre feia girar la clau al pany. La galeria era plena de coloms i també n’hi havia al passadís i els nens no eren enlloc.","questions":[{"id":"f04-q1","kind":"Símbols i tema","prompt":"Què simbolitza la presència dels coloms dins del pis? Relaciona-la amb la situació de Natàlia.","model":"Els coloms simbolitzen l’ocupació progressiva de la vida de Natàlia per obligacions que no ha triat. La frase «Cada dia estava més cansada» prepara la descoberta d’una galeria i un passadís plens d’aus. La invasió ja no afecta només el terrat: entra dins de l’espai familiar. Segons els apunts, la cria impulsada per Quimet es vincula amb una maternitat viscuda com a càrrega i pèrdua d’identitat. Així, l’objecte quotidià es transforma en una imatge d’opressió.","evidence":["Cada dia estava més cansada","La galeria era plena de coloms"],"notesPages":[7,12],"words":75},{"id":"f04-q2","kind":"Veu i estil","prompt":"Com es construeix l’oralitat en aquest fragment? Justifica la resposta amb exemples.","model":"L’oralitat apareix en les repeticions, les coordinacions amb «i» i la reproducció pròxima de les veus infantils. La reiteració de «hiiiii» imita un so i dona expressivitat a l’escena; «calla» introdueix directament la intervenció del nen. Natàlia conta la descoberta en primera persona, acumulant accions i sensacions com si les confiara al lector. No és una transcripció descuidada de la parla: Rodoreda treballa un registre popular estilitzat que revela alhora el cansament i la inquietud de la narradora.","evidence":["hiiiii","calla"],"notesPages":[8,9,11],"words":78},{"id":"f04-q3","kind":"Personatge","prompt":"Descriu Natàlia a partir del fragment i explica com evolucionarà respecte dels coloms.","model":"Natàlia apareix com una mare esgotada que intenta comprendre el comportament dels fills i controlar una casa cada vegada menys seua. Diu que entra «com si entrés a robar», comparació que suggereix una estranya pèrdua de pertinença al propi espai. La presència dels coloms intensifica aquesta alienació. Més endavant, al capítol XXV, decidirà posar fi a la cria, iniciant una revolta personal. Després de la guerra, reconstruirà la vida i transformarà també el significat dels records.","evidence":["com si entrés a robar","Cada dia estava més cansada"],"notesPages":[7,8,9,12],"words":76},{"id":"f04-q4","kind":"Context: models narratius","prompt":"Diferencia la novel·la psicològica de Rodoreda del realisme social del seu context.","model":"La novel·la psicològica prioritza la consciència i les emocions dels personatges. En aquest fragment, el cansament de Natàlia i la comparació «com si entrés a robar» transformen l’escena domèstica en experiència d’alienació. El realisme social de postguerra, representat als apunts per autors com Josep Maria Espinàs, Teresa Pàmies o Maria Ibars, posa més èmfasi en el testimoni col·lectiu i la denúncia de les injustícies. Les dues tendències poden tractar conflictes socials, però els organitzen des de perspectives diferents.","evidence":["com si entrés a robar"],"notesPages":[2,6,9],"words":78}]},{"id":"f05","title":"La revolta contra els coloms","page":101,"chapter":"XXV","part":"La revolució","text":"Sentia la brasa a dins del cervell, encesa i vermella. Veces, abeuradors, menjadors, colomar i cabassos de colomassa, tot a passeig! Escala de paleta, espart, bola de sofre, bútxeres, ullets vermells i potes vermelles, tot a passeig! Cua de gall dindi, caputxa, monja, colomins i colomons, tot a passeig! La golfa del terrat per mi, la trapa tapada, les cadires a dintre de la golfa, la volta dels coloms aturada, el cove de la roba al terrat, la roba estesa al terrat. Els ulls rodons i els becs punxents, el tornassol malva i el tornassol poma, tot a passeig! La mare d’en Quimet, sense voler, m’havia donat el remei… I vaig començar a marejar els coloms mentre covaven. Aprofitava que els nens dormien en havent dinat i aleshores pujava al terrat i turmentava els coloms. La golfa del terrat bullia com un forn, tot el sol del dematí s’apilotava al sostre i el feia cremar; i entre la febre dels coloms i la pudor de la febre, allò era l’infern.","questions":[{"id":"f05-q1","kind":"Argument i evolució","prompt":"Situa aquest fragment i explica per què representa una revolució personal.","model":"El fragment pertany al capítol XXV, inici de la part titulada «La revolució». Natàlia decideix acabar amb la cria de coloms que li ha imposat Quimet i comença a destorbar-los mentre coven. «La golfa del terrat per mi» manifesta una voluntat de recuperar espai propi. La repetició de «tot a passeig!» converteix el pensament en una declaració de ruptura. Aquesta rebel·lió domèstica anticipa una recuperació d’individualitat i coincideix, en el desenvolupament general, amb l’aproximació de la crisi col·lectiva.","evidence":["La golfa del terrat per mi","tot a passeig!"],"notesPages":[7,8],"words":78},{"id":"f05-q2","kind":"Estil","prompt":"Analitza la repetició, l’enumeració i la metàfora en el fragment.","model":"La repetició de «tot a passeig!» dona ritme i força a la decisió de Natàlia. Les enumeracions de recipients, eines i tipus de coloms fan visible l’acumulació de tasques que l’ofeguen. La «brasa a dins del cervell» representa metafòricament la persistència ardent de la revolta. Al final, el terrat «bullia com un forn», comparació que reforça la sensació d’asfíxia. El fragment combina així oralitat i lirisme per convertir un conflicte quotidià en una experiència interior intensa.","evidence":["tot a passeig!","brasa a dins del cervell","bullia com un forn"],"notesPages":[9,11,12],"words":76},{"id":"f05-q3","kind":"Tema i símbol","prompt":"Quina temàtica pròpia de l’obra destaca ací? Explica com canvia la relació amb el símbol dels coloms.","model":"Hi destaca la lluita contra l’opressió i la recerca d’autonomia. Abans, Natàlia assumia la neteja i l’alimentació dels coloms com una obligació imposada; ara anuncia que vol «la volta dels coloms aturada». El símbol deixa de ser només una càrrega suportada i es converteix en l’objectiu d’una acció conscient. La protagonista encara no ha resolt tots els seus problemes, però comença a resistir-se. Aquesta transformació prepara el llarg procés d’alliberament que culminarà al desenllaç de la novel·la.","evidence":["la volta dels coloms aturada"],"notesPages":[7,8,12],"words":77},{"id":"f05-q4","kind":"Context: Kafka","prompt":"Relaciona aquest fragment amb la influència de Kafka explicada als apunts, sense confondre influència i autoria.","model":"Els apunts vinculen Kafka amb la pèrdua d’identitat i amb l’angoixa d’un món que absorbeix l’individu. La proliferació dels coloms i la descripció del terrat com «l’infern» permeten aquesta lectura: un fet domèstic esdevé una experiència opressiva, quasi de malson. Ara bé, el fragment és de Rodoreda i mostra una resposta activa de Natàlia davant d’aquella invasió. La influència kafkiana ajuda a interpretar l’alienació, però no elimina l’oralitat, el simbolisme i la trajectòria personal propis de l’obra.","evidence":["l’infern"],"notesPages":[5,6,7],"words":77}]},{"id":"f06","title":"La guerra darrere dels llums blaus","page":119,"chapter":"XXXI","part":"La revolució","text":"Tots els llums eren blaus. Semblava el país dels màgics i era bonic. Així que queia el dia tot era de color blau. Havien pintat de blau els vidres dels fanals alts i els vidres dels fanals baixos i a les finestres de les cases, fosques, si es veia una mica de llum, de seguida xiulets. I quan van bombardejar des del mar, el meu pare va morir. No per culpa de cap bomba del bombardeig, sinó perquè, de l’espant, se li va parar el cor i s’hi va quedar. Em costava d’adonar-me que era mort perquè ja feia temps que era com si fos mig mort… com si no fos res meu, ni res que jo pogués voler com a meu, com si quan es va morir la meva mare el meu pare també s’hagués mort.","questions":[{"id":"f06-q1","kind":"Marc històric","prompt":"Quins indicis permeten reconéixer la guerra i com la viu la narradora?","model":"Els vidres dels fanals pintats de blau, la vigilància de les finestres i el bombardeig des del mar situen el fragment en la Guerra Civil. Natàlia no ofereix una explicació militar, sinó els efectes de la guerra sobre la vida quotidiana i familiar. La primera impressió, «Semblava el país dels màgics i era bonic», contrasta amb la mort del pare per l’espant. Aquesta oposició mostra una mirada subjectiva capaç d’unir estranyesa visual, innocència perceptiva i experiència tràgica.","evidence":["Semblava el país dels màgics i era bonic","bombardejar des del mar"],"notesPages":[8,9,11],"words":77},{"id":"f06-q2","kind":"Personatges i memòria","prompt":"Com es presenta la relació de Natàlia amb son pare? Justifica-ho amb el fragment.","model":"La relació amb el pare està marcada pel distanciament afectiu. Natàlia afirma que ja feia temps que era «com si fos mig mort» i relaciona aquesta ruptura amb la mort de la mare. Així, la desaparició física no produeix un dol senzill ni immediat: li costa adonar-se’n perquè el vincle ja estava deteriorat. La primera persona permet expressar aquesta contradicció sense un judici extern. El passatge mostra que la memòria familiar conté ferides i sentiments ambivalents, no només records idealitzats.","evidence":["com si fos mig mort","quan es va morir la meva mare"],"notesPages":[8,9],"words":80},{"id":"f06-q3","kind":"Corrent i perspectiva","prompt":"Per què aquest passatge és més que una crònica històrica objectiva?","model":"Encara que aporta referents reconeixibles de guerra, el fragment està organitzat per la percepció i els vincles de Natàlia. Els llums blaus primer li semblen màgics; després apareixen el bombardeig, l’espant i el distanciament respecte del pare. La realitat externa es combina amb el món emocional. Això correspon al model de novel·la psicològica descrit als apunts, que fusiona història i interioritat. La narradora no sap ni explica tota la guerra: selecciona allò que travessa la seua experiència.","evidence":["Tots els llums eren blaus","de l’espant"],"notesPages":[6,8,9,11],"words":77},{"id":"f06-q4","kind":"Context: postguerra","prompt":"Explica com afecta la Guerra Civil la producció literària de Rodoreda i el seu context cultural.","model":"El bombardeig del fragment forma part de la guerra viscuda pels personatges. En la trajectòria de Rodoreda, la derrota republicana comporta l’exili de 1939 i una llarga separació del país. La cultura catalana pateix repressió, censura i pèrdua d’infraestructures editorials; altres escriptors viuen l’exili exterior o interior. Rodoreda converteix aquesta experiència històrica en literatura de maduresa. Cal distingir, per tant, la mort del pare narrada per Natàlia de la biografia real de l’autora, encara que compartisquen el rerefons bèl·lic.","evidence":["el meu pare va morir"],"notesPages":[1,4,5],"words":79}]},{"id":"f07","title":"Els fills convertits en ous","page":132,"chapter":"XXXIV","part":"La revolució","text":"I van venir unes mans. El sostre de l’habitació es va fer tou com si fos de núvol. Eren unes mans de cotó fluix, sense ossos. I mentre baixaven es feien transparents, com les meves mans, quan, de petita, les mirava contra sol. I aquestes mans que sortien del sostre juntes, mentre baixaven es separaven, i els nens, mentre les mans baixaven, ja no eren nens. Eren ous. I les mans agafaven els nens tots fets de closca i amb rovell a dintre i els aixecaven amb molt de compte i els començaven a sacsejar: de primer sense pressa i aviat amb ràbia, com si tota la ràbia dels coloms i de la guerra i d’haver perdut s’hagués ficat en aquelles mans que sacsejaven els meus fills. Volia cridar i la veu no em sortia. Volia cridar que vinguessin els veïns, que vingués la policia, que vingués algú a empaitar aquelles mans, i quan ja tenia el crit a punt de sortir, em repensava i tancava el crit a dintre perquè la policia m’hauria agafat perquè en Quimet havia mort a la guerra.","questions":[{"id":"f07-q1","kind":"Símbols i somni","prompt":"Interpreta la transformació dels fills en ous i relaciona-la amb els coloms.","model":"En el somni, els fills «ja no eren nens. Eren ous», de manera que la maternitat humana es confon amb la cria dels coloms. Les mans que els sacsegen traslladen als infants una violència vinculada a «la ràbia dels coloms i de la guerra». El passatge concentra culpa, por i desesperació. Segons els apunts, l’univers oníric permet expressar conflictes profunds de Natàlia. No s’ha d’interpretar la transformació com un fet realista, sinó com una representació simbòlica de la seua angoixa.","evidence":["ja no eren nens. Eren ous","la ràbia dels coloms i de la guerra"],"notesPages":[6,7,8,12],"words":80},{"id":"f07-q2","kind":"Veu i estil","prompt":"Relaciona la focalització interna amb el caràcter oníric i les repeticions del fragment.","model":"Només accedim al somni tal com el viu Natàlia, amb focalització interna fixa. La transformació del sostre i dels fills no rep una explicació exterior: forma part de la seua experiència mental. La repetició de «Volia cridar» insisteix en la impotència de demanar ajuda, mentre que les mans «de cotó fluix, sense ossos» creen una imatge inquietant. La prosa associa sensacions, records i por, però manté una seqüència comprensible: no és necessàriament un monòleg interior sense cap ordre.","evidence":["Volia cridar","de cotó fluix, sense ossos"],"notesPages":[6,8,9,11],"words":78},{"id":"f07-q3","kind":"Argument i dimensió col·lectiva","prompt":"Situa el fragment i explica com connecta el patiment íntim amb la derrota col·lectiva.","model":"El somni apareix al capítol XXXIV, dins de la part «La revolució», quan la guerra i la misèria han dut Natàlia a una situació extrema. L’expressió «d’haver perdut» incorpora al malson personal la derrota compartida, i la referència a Quimet mort a la guerra explica la por de la narradora davant de la policia. El patiment dels fills no és només un conflicte privat: reflecteix també la vulnerabilitat de les famílies vençudes. Després arribarà l’ajuda decisiva de l’adroguer.","evidence":["d’haver perdut","en Quimet havia mort a la guerra"],"notesPages":[6,8],"words":78},{"id":"f07-q4","kind":"Context: models posteriors","prompt":"Com evoluciona la narrativa després del context de publicació de La plaça del Diamant?","model":"Als anys setanta conviuen la continuïtat dels autors de postguerra i l’experimentalisme de noves generacions. Els apunts destaquen fragmentació, múltiples narradors, ruptures sintàctiques i influència de la cultura de masses, amb noms com Biel Mesquida o Quim Monzó. Aquest fragment de Rodoreda ja explora el somni i la subjectivitat —els fills «Eren ous»—, però manté una veu protagonista estable i una història recognoscible. No convé identificar automàticament qualsevol element irracional amb el textualisme posterior: pertanyen a projectes narratius diferents.","evidence":["Eren ous"],"notesPages":[2,3,6,9],"words":79}]},{"id":"f08","title":"L’oferta de l’adroguer","page":141,"chapter":"XXXVI","part":"L’alliberament","text":"Va dir que, si no tenia feina, ell era una bona casa i poc marejador i que ja sabia que jo era complidora. Vaig fer que sí amb el cap i aleshores va dir, comenci demà, i tot neguitós em va posar dues llaunes al cabàs, que va anar a buscar a dintre, i una paperina i alguna altra cosa que no recordo. I va dir-me que podia començar l’endemà a les nou del matí. I d’esma vaig treure l’ampolla del salfumant de dintre del cabàs i la vaig posar amb molt de compte damunt del taulell. I me’n vaig anar sense dir res. I quan vaig arribar al pis, jo, que sempre havia estat dura de plors, vaig arrencar a plorar com si fos una qualsevol cosa.","questions":[{"id":"f08-q1","kind":"Argument","prompt":"Situa el fragment i explica per què l’oferta de treball és decisiva per a l’argument.","model":"El fragment correspon al capítol XXXVI, al començament de «L’alliberament». Natàlia, desesperada per la fam i la falta de recursos, ha anat a l’adroguer en un moment límit. Antoni li ofereix treball i aliments; ella deixa l’ampolla al taulell. El gest de retirar-la del cabàs indica un canvi de direcció: accepta una possibilitat de supervivència. El plor final exterioritza la tensió acumulada. Aquesta ajuda obri el procés de reconstrucció material i afectiva que caracteritza la darrera part de la novel·la.","evidence":["comenci demà","damunt del taulell","vaig arrencar a plorar"],"notesPages":[8,10],"words":80},{"id":"f08-q2","kind":"Personatges","prompt":"Caracteritza Antoni a partir del fragment i contraposa’l a Quimet.","model":"Antoni mostra una masculinitat basada en l’atenció i l’ajuda concreta. Es presenta com «poc marejador», reconeix que Natàlia és treballadora i li dona aliments abans d’iniciar la feina. L’oferta «comenci demà» obri una eixida a la seua precarietat. Quimet, en canvi, representa als apunts l’autoritat i la imposició de càrregues. El contrast no converteix Antoni en un salvador abstracte: el fragment mostra gestos quotidians de respecte i suport que permeten a Natàlia reprendre la vida.","evidence":["poc marejador","comenci demà"],"notesPages":[9,10],"words":75},{"id":"f08-q3","kind":"Estil i emocions","prompt":"Com mostra el text l’estat de Natàlia sense una explicació psicològica abstracta?","model":"L’estat de Natàlia s’expressa mitjançant gestos i reaccions corporals: fa que sí amb el cap, trau l’ampolla «d’esma» i la deixa amb cura. La narradora afirma que sempre havia estat «dura de plors», però acaba plorant. Aquest contrast fa visible el desbordament emocional i l’alleujament sense anomenar-los de manera teòrica. Les accions menudes i la primera persona acosten el lector a la seua vivència. És un exemple de com Rodoreda construeix profunditat psicològica amb llenguatge planer i detalls concrets.","evidence":["d’esma","dura de plors"],"notesPages":[8,9,11],"words":79},{"id":"f08-q4","kind":"Context: autores","prompt":"Comenta la rellevància de Rodoreda i esmenta quatre autores de postguerra o posteriors vinculades almenys a dos gèneres.","model":"Rodoreda és un referent de la narrativa catalana de postguerra per la densitat psicològica i simbòlica de la seua obra. Ací dona veu directa a una dona popular que acaba dient «vaig arrencar a plorar». En narrativa destaquen Teresa Pàmies, pel testimoni i la memòria, i Maria Aurèlia Capmany, per la perspectiva crítica. Posteriorment sobresurten Montserrat Roig, en narrativa, i Maria-Mercè Marçal, en poesia. Aquests quatre noms mostren una presència femenina que creix i es diversifica en gèneres i generacions.","evidence":["vaig arrencar a plorar"],"notesPages":[2,3,4,9],"words":80}]},{"id":"f09","title":"Una proposta amb respecte","page":149,"chapter":"XXXIX","part":"L’alliberament","text":"I va dir que era un home sol. Un home tot sol: ni pares ni família de cap mena. Sol com la pluja que vola. I que era de bona fe i que sobretot no em prengués malament el que volia dir-me… I volia dir-me que era un home sol que no sabia viure sol… I va estar una bona estona callat i va dir aixecant el cap i mirant-me fort: em voldria casar, però no puc fundar una família… I va clavar un cop de mà a la taula amb tota la seva força. Això va dir: que no podia fundar una família i que es volia casar. I anava fent una boleta verda amb la molsa que havia tret del gerro de llautó. Es va aixecar i es va posar de cara a la japonesa, i després es va girar i es va tornar a asseure, i mentre s’asseia, quan encara no estava ben assegut, va preguntar: —Es voldria casar amb mi?","questions":[{"id":"f09-q1","kind":"Personatges i oralitat","prompt":"Què revelen les vacil·lacions i els gestos d’Antoni? Justifica-ho amb el fragment.","model":"Antoni no formula la proposta com una ordre: insisteix en la soledat i tem que Natàlia interprete malament les seues paraules. «No em prengués malament» mostra aquesta cautela, mentre la boleta de molsa i el canvi de postura revelen nerviosisme. La pregunta «Es voldria casar amb mi?» deixa oberta una resposta, a diferència de les imposicions de Quimet. La repetició d’«un home sol» i les pauses reprodueixen un discurs oral costós que permet intuir la vulnerabilitat del personatge.","evidence":["no em prengués malament","Es voldria casar amb mi?","Un home tot sol"],"notesPages":[9,10,11],"words":78},{"id":"f09-q2","kind":"Argument i contrast","prompt":"Situa el fragment en l’argument i compara aquesta relació amb l’inici de la relació amb Quimet.","model":"Aquest passatge del capítol XXXIX pertany a «L’alliberament», després que Natàlia haja començat a treballar per a Antoni. L’adroguer reconeix que no pot fundar una família i li pregunta si es voldria casar amb ell. El to insegur i respectuós contrasta amb l’actitud inicial de Quimet, que decidia el futur matrimoni i fins i tot el nom de Natàlia. La pregunta directa apunta a una convivència menys dominadora, encara que la reconstrucció del passat dolorós continuarà fins al desenllaç.","evidence":["no puc fundar una família","Es voldria casar amb mi?"],"notesPages":[7,8,10],"words":79},{"id":"f09-q3","kind":"Lirisme","prompt":"Com s’uneixen llenguatge quotidià i expressivitat poètica en aquest fragment?","model":"El relat combina una conversa senzilla amb imatges d’alta intensitat emocional. La comparació «Sol com la pluja que vola» transforma la soledat d’Antoni en una sensació de desemparament. Alhora, detalls quotidians com la boleta de molsa i el moviment de les mans materialitzen la seua inseguretat. Les reiteracions d’«I va dir» acosten la narració a l’oralitat. La suma d’aquests recursos confirma que la prosa popular de Rodoreda està elaborada literàriament i pot expressar una psicologia sense abandonar els objectes humils.","evidence":["Sol com la pluja que vola","I va dir"],"notesPages":[6,9,11,12],"words":80},{"id":"f09-q4","kind":"Context: altres narradors","prompt":"Esmenta altres models narratius del context de Rodoreda i diferencia’ls del que mostra el fragment.","model":"Els apunts situen, al costat de la novel·la psicològica, el realisme social i la narrativa fantàstica o humorística. Espinàs i Maria Ibars exemplifiquen l’interés per les condicions socials; Pere Calders, la fantasia i la ironia; Enric Valor manté també el realisme tradicional. En canvi, ací l’atenció se centra en la vulnerabilitat d’Antoni, condensada en «Un home tot sol», i en la percepció de Natàlia. El conflicte social no desapareix, però es narra a través d’una experiència afectiva i subjectiva.","evidence":["Un home tot sol"],"notesPages":[2,6,9],"words":79}]},{"id":"f10","title":"El crit i la joventut que fuig","page":181,"chapter":"XLIX","part":"L’alliberament","text":"Un crit que devia fer molts anys que duia a dintre, i amb aquell crit, tan ample que li havia costat de passar-me pel coll, em va sortir de la boca una mica de cosa de no res, com un escarabat de saliva… i aquella mica de cosa de no res que havia viscut tant de temps tancada a dintre era la meva joventut que fugia amb un crit que no sabia ben bé què era… abandonament? Em van tocar el braç i vaig girar-me sense esglai i un home vell em preguntava si estava malalta i vaig sentir que obrien un balcó. Que no es troba bé? I s’acostava una vella i el vell i la vella es van quedar plantats al meu davant i en el balcó hi havia una ombra blanca. Ja m’ha passat, vaig dir.","questions":[{"id":"f10-q1","kind":"Símbol i desenllaç","prompt":"Explica el significat del crit i relaciona’l amb l’evolució de Natàlia.","model":"El crit simbolitza una catarsi: Natàlia expulsa un dolor que havia quedat retingut durant anys. La narradora identifica allò que ix de dins com «la meva joventut que fugia», expressió que vincula el gest amb l’abandó d’un passat d’opressió i pèrdues. No significa que tot s’esborre, sinó que pot relacionar-s’hi d’una altra manera. Situat al capítol final, el crit culmina el procés que va de la identitat imposada de Colometa a una maduresa amb més autonomia i estabilitat.","evidence":["la meva joventut que fugia","molts anys que duia a dintre"],"notesPages":[8,9,10],"words":78},{"id":"f10-q2","kind":"Estil i subjectivitat","prompt":"Relaciona les imatges del fragment amb la prosa poètica de Rodoreda.","model":"La narradora converteix una vivència interior en imatges físiques. El crit és «tan ample» que sembla travessar amb dificultat el coll, i allò expulsat es compara amb «un escarabat de saliva». La joventut es presenta com una realitat que pot fugir del cos. Aquesta materialització del patiment combina comparació, hipèrbole i simbolisme. El resultat no és una descripció clínica, sinó una expressió subjectiva del trauma. La pregunta «abandonament?» introdueix, a més, una vacil·lació que manté el to íntim i oral.","evidence":["tan ample","un escarabat de saliva","abandonament?"],"notesPages":[8,9,11,12],"words":80},{"id":"f10-q3","kind":"Argument i memòria","prompt":"Situa el passatge dins de l’argument i explica el sentit del retorn als espais del passat.","model":"El fragment forma part del capítol XLIX, després de les noces de Rita. Natàlia ha tornat a l’antiga casa i a la plaça del Diamant, espais vinculats amb Quimet i amb l’inici de la seua submissió. El retorn culmina en el crit que deixa eixir una experiència llargament reprimida. «Ja m’ha passat» assenyala que aquella crisi té un desenllaç immediat, però el sentit general és més profund: el passat es revisita per poder continuar vivint al costat d’Antoni.","evidence":["Ja m’ha passat","molts anys que duia a dintre"],"notesPages":[8,9,11],"words":78},{"id":"f10-q4","kind":"Context: llegat i noves veus","prompt":"Quina continuïtat té el llegat de Rodoreda en la narrativa posterior? Esmenta autores i alguns canvis.","model":"Els apunts assenyalen Rodoreda com un referent per a autores posteriors com Montserrat Roig i Carme Riera. La centralitat d’una veu femenina i la relació entre memòria i identitat —ací condensada en «la meva joventut que fugia»— ajuden a entendre aquest llegat. Als anys setanta, però, s’amplien els temes amb el feminisme, la contracultura i nous models formals. La continuïtat no implica imitació: les noves autores reformulen l’experiència de les dones i la memòria des d’altres generacions i contextos.","evidence":["la meva joventut que fugia"],"notesPages":[2,3,4],"words":79}]}]}</script>
<script>(()=>{
  const DATA=JSON.parse(document.getElementById('studyData').textContent);
  const $=id=>document.getElementById(id);
  const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const shuffle=list=>{const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const norm=value=>String(value??'').normalize('NFC').toLocaleLowerCase('ca').replace(/[’‘ʼ`´]/g,"'").replace(/[‐‑–—]/g,'-').replace(/[.,;:!?¡¿]/g,'').replace(/\s+/g,' ').trim().replace(/\s*'\s*/g,"'").replace(/\s*-\s*/g,'-');
  const state={module:null,type:'substitution',filters:{difficulty:'all',vowel:'all',rule:'all',kind:'all',group:'all',topic:'all',length:10},deck:[],index:0,answered:false,correct:0,total:0,results:[],choices:[],hints:0,usedHint:false};
  const modules={phonetics:{name:'Fonètica',label:'Escolta el timbre',symbol:'è',color:'orange'},pronouns:{name:'Pronoms febles',label:'Relaciona i substituïx',symbol:'li',color:'violet'},literature:{name:'Mercè Rodoreda',label:'Llig i connecta',symbol:'R',color:'green'},verbs:{name:'Verbs',label:'Temps, aspecte i mode',symbol:'V',color:'violet'}};
  function goTop(){window.scrollTo({top:0,behavior:'smooth'})}
  function setNav(module){document.querySelectorAll('[data-module]').forEach(b=>b.classList.toggle('is-active',b.dataset.module===module));$('currentSection').textContent=module?modules[module].name:'El teu espai de pràctica'}
  function home(){state.module=null;setNav(null);$('app').innerHTML=`<section class="home-heading"><div><p class="eyebrow">2n de Batxillerat · Preparació PAU</p><h1>Valencià,<br><em>en pràctica.</em></h1><p class="lead">Tria un bloc, posa’t a prova i entén cada resposta.</p></div><div class="home-note"><span class="note-title">La manera de practicar</span><p>Intenta-ho. Consulta una pista si la necessites. Corregix i queda’t amb la norma.</p><span class="note-footer">Al teu ritme, sense cronòmetre.</span></div></section><section class="subject-grid" aria-label="Blocs de pràctica">${Object.entries(modules).map(([id,m],i)=>`<button class="subject-card ${m.color}" data-open="${id}"><span class="subject-order">0${i+1}</span><span class="subject-symbol" aria-hidden="true">${m.symbol}</span><h2>${m.name}</h2><p>${id==='phonetics'?'E i O obertes o tancades. Normes, excepcions i context.':id==='pronouns'?'Substituïx complements i completa textos segons els antecedents.':id==='verbs'?'Temps, aspecte, mode, conjugació i persona en cada frase.':'Test i pràctica escrita amb fragments de La plaça del Diamant.'}</p><span class="subject-count">${id==='phonetics'?DATA.phonetics.items.length+' exemples · 23 famílies de normes':id==='pronouns'?DATA.pronouns.items.length+' frases · '+DATA.pronouns.texts.length+' textos':id==='verbs'?DATA.verbs.length+' frases · 5 tries per exercici':DATA.literature.length+' preguntes test · 10 fragments'}</span><span class="subject-action">Practicar <b aria-hidden="true">+</b></span></button>`).join('')}</section><div class="bottom-note"><span>Materials de classe + contrast normatiu</span><button class="text-button" id="homeSources">Veure les fonts i els aclariments</button></div>`;document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>setup(b.dataset.open)));$('homeSources').addEventListener('click',sources);goTop()}
  const fragmentPractice={part:'all',index:0,drafts:{},storage:true};
  try{const saved=JSON.parse(window.localStorage.getItem('valencia-fragments-v1')||'{}');if(saved&&typeof saved==='object'&&!Array.isArray(saved))for(const [key,value] of Object.entries(saved))if(typeof value==='string')fragmentPractice.drafts[key]=value;}catch{fragmentPractice.storage=false;}
  function words(text){return text.trim()?text.trim().split(/\s+/u).length:0}
  function persistFragmentDrafts(){try{window.localStorage.setItem('valencia-fragments-v1',JSON.stringify(fragmentPractice.drafts));}catch{fragmentPractice.storage=false;}const status=$('fragmentSaveStatus');if(status)status.textContent=fragmentPractice.storage?'Respostes guardades en este navegador.':'Respostes conservades durant esta sessió.';}
  function fragmentLibrary(){state.module='literature';setNav('literature');const available=DATA.fragments.filter(f=>fragmentPractice.part==='all'||f.part===fragmentPractice.part);$('app').innerHTML=`<section class="section-heading"><p class="eyebrow">Mercè Rodoreda · Pràctica escrita</p><h1>Llig. Relaciona.<br><em>Argumenta.</em></h1><p class="lead">${DATA.fragments.length} fragments de <i>La plaça del Diamant</i> i ${DATA.fragments.reduce((n,f)=>n+f.questions.length,0)} preguntes originals inspirades en els exemples de classe.</p></section><div class="mode-tabs fragment-mode-tabs" role="group" aria-label="Pràctica de literatura"><button id="backLiteratureTest">Test de quatre opcions</button><button class="active" aria-pressed="true">Fragments i preguntes</button></div><aside class="mini-note"><b>Escriu abans de mirar el model</b><p>No hi ha correcció automàtica ni puntuació. Cada pregunta té un camp de resposta i un model desplegable amb proves del text i referències als apunts. Orientació d’extensió: 75-80 paraules, com en els exemples; pots escriure’n més.</p></aside><section class="fragment-library"><div class="filter-row"><label>Part de la novel·la<select id="fragmentPart">${options([['all','Totes les parts'],...[...new Set(DATA.fragments.map(f=>f.part))].map(p=>[p,p])],fragmentPractice.part)}</select></label><button class="secondary" id="randomFragment" ${available.length?'':'disabled'}>Un fragment a l’atzar</button></div><div class="fragment-tiles">${available.map(f=>`<button class="fragment-tile" data-fragment="${esc(f.id)}"><span>Fragment ${String(DATA.fragments.indexOf(f)+1).padStart(2,'0')}</span><h2>${esc(f.title)}</h2><p>${esc(f.part)} · ${f.questions.length} preguntes</p><small>${f.questions.filter(q=>(fragmentPractice.drafts[q.id]||'').trim()).length} respostes escrites</small><b aria-hidden="true">Llegir →</b></button>`).join('')}</div></section>`;$('backLiteratureTest').addEventListener('click',()=>setup('literature'));$('fragmentPart').addEventListener('change',()=>{fragmentPractice.part=$('fragmentPart').value;fragmentLibrary()});$('randomFragment').addEventListener('click',()=>openFragment(DATA.fragments.indexOf(available[Math.floor(Math.random()*available.length)])));document.querySelectorAll('[data-fragment]').forEach(b=>b.addEventListener('click',()=>openFragment(DATA.fragments.findIndex(f=>f.id===b.dataset.fragment))));goTop();}
  function openFragment(index){if(index<0||index>=DATA.fragments.length)return;fragmentPractice.index=index;state.module='literature';setNav('literature');const f=DATA.fragments[index];$('app').innerHTML=`<div class="practice-top"><button class="back-button" id="backFragmentLibrary">‹ Triar un altre fragment</button><span class="practice-label">Pràctica escrita · Sense qualificació</span></div><section class="fragment-heading"><div><p class="eyebrow">Fragment ${String(index+1).padStart(2,'0')} / ${DATA.fragments.length}</p><h1>${esc(f.title)}</h1></div><div class="fragment-arrows"><button class="secondary" id="previousFragment" ${index===0?'disabled':''} aria-label="Fragment anterior">←</button><button class="secondary" id="nextFragment" ${index===DATA.fragments.length-1?'disabled':''} aria-label="Fragment següent">→</button></div></section><div class="fragment-layout"><article class="fragment-reading"><span class="fragment-reading-label">Mercè Rodoreda · La plaça del Diamant</span><blockquote>${esc(f.text)}</blockquote><p class="fragment-text-note">Extracte del llibre aportat. S’han ajuntat paraules tallades per salts de línia del PDF; es conserva la llengua del text.</p><details class="fragment-reference"><summary>Consultar la localització del fragment</summary><p>Capítol ${esc(f.chapter)} · pàgina ${f.page} del PDF aportat (numeració del visor, no d’una edició impresa).</p></details></article><section class="fragment-questions" aria-label="Preguntes del fragment">${f.questions.map((q,i)=>`<article class="fragment-question"><p class="exercise-kicker">${i+1}. ${esc(q.kind)}</p><h2 id="prompt-${esc(q.id)}">${esc(q.prompt)}</h2><label class="input-label" for="draft-${esc(q.id)}">La teua resposta</label><textarea class="fragment-draft" id="draft-${esc(q.id)}" data-fragment-answer="${esc(q.id)}" aria-labelledby="prompt-${esc(q.id)}" rows="5" placeholder="Planteja la idea, justifica-la amb el fragment i relaciona-la amb l’obra...">${esc(fragmentPractice.drafts[q.id]||'')}</textarea><div class="fragment-wordcount"><span id="count-${esc(q.id)}">${words(fragmentPractice.drafts[q.id]||'')} paraules</span><span>Orientació: 75-80</span></div><details class="fragment-model" data-model="${esc(q.id)}"><summary>Veure una resposta model</summary><div class="fragment-model-body"><p>${esc(q.model)}</p><div class="fragment-evidence"><strong>Suport del fragment</strong><ul>${q.evidence.map(e=>`<li>«${esc(e)}»</li>`).join('')}</ul><p>${q.kind.startsWith('Context:')?'Les dades de context provenen dels apunts; estes paraules del fragment servixen per a relacionar-hi la interpretació.':'Estos indicis del fragment sustenten la interpretació del model.'}</p></div><p class="source-line">Apunts de classe, ${q.notesPages.length===1?'pàgina':'pàgines'} ${q.notesPages.join(', ')}. Model orientatiu: pots expressar les mateixes idees d’altres maneres.</p></div></details></article>`).join('')}<div class="fragment-save"><p id="fragmentSaveStatus">${fragmentPractice.storage?'Respostes guardades en este navegador.':'Respostes conservades durant esta sessió.'}</p><button class="secondary" id="downloadFragmentAnswers">Descarregar les meues respostes</button></div></section></div><div class="fragment-bottom"><button class="secondary" id="fragmentLibraryBottom">Tornar als fragments</button><p>Les preguntes són originals; el format seguix els exemples aportats, incloses les preguntes PAU reproduïdes en eixe document.</p></div>`;
    $('backFragmentLibrary').addEventListener('click',fragmentLibrary);$('fragmentLibraryBottom').addEventListener('click',fragmentLibrary);$('previousFragment').addEventListener('click',()=>openFragment(index-1));$('nextFragment').addEventListener('click',()=>openFragment(index+1));document.querySelectorAll('[data-fragment-answer]').forEach(input=>input.addEventListener('input',()=>{const key=input.dataset.fragmentAnswer;fragmentPractice.drafts[key]=input.value;$('count-'+key).textContent=words(input.value)+' paraules';persistFragmentDrafts()}));$('downloadFragmentAnswers').addEventListener('click',()=>{const text=['La plaça del Diamant · '+f.title,'Capítol '+f.chapter+' · Pàgina '+f.page+' del PDF','',...f.questions.flatMap((q,i)=>[(i+1)+'. '+q.prompt,fragmentPractice.drafts[q.id]||'[Sense resposta]',''])].join('\n');const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='rodoreda-'+f.id+'-respostes.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});goTop();
  }

  const verbPersons=['','1a persona del singular','2a persona del singular','3a persona del singular','1a persona del plural','2a persona del plural','3a persona del plural'];
  function setupVerbs(){state.module='verbs';setNav('verbs');state.filters.length=10;state.filters.verbMode=state.filters.verbMode||'all';$('app').innerHTML=`<section class="section-heading"><p class="eyebrow">Morfologia verbal · Batxillerat</p><h1>Què expressa<br><em>esta forma verbal?</em></h1><p class="lead">Identifica temps, aspecte, mode, conjugació i persona.</p></section><section class="setup-card"><div class="filter-row"><label>Mode<select id="verbModeFilter">${options([['all','Tots els modes'],['Indicatiu','Indicatiu'],['Subjuntiu','Subjuntiu'],['Imperatiu','Imperatiu']],state.filters.verbMode)}</select></label><label>Ronda<select id="verbLength">${options([[10,'10 frases'],[20,'20 frases'],['all','Totes les frases']],state.filters.length)}</select></label></div><div class="setup-bottom"><span id="availableCount" role="status"></span><button class="primary" id="startPractice">Començar</button></div></section><aside class="mini-note"><b>Criteri escolar d’esta pràctica</b><p><b>Perfectiu:</b> temps compostos amb haver i passats simple o perifràstic. <b>Imperfectiu:</b> la resta, inclosos futur, condicional simple i imperatiu. <b>L’imperatiu es marca com a present.</b> Tots els camps tenen una resposta concreta.</p><p>Este criteri simplifica les distincions aspectuals d’altres descripcions gramaticals. El condicional s’inclou en l’indicatiu.</p><p>La conjugació correspon al <b>verb principal</b>: «hem llegit» és de llegir (3a), no de l’auxiliar haver. Segons l’AVL, <b>dir, fer, tindre i vindre són de la 2a conjugació</b>. En persona, diferencia també singular i plural.</p></aside>`;$('verbModeFilter').addEventListener('change',()=>{state.filters.verbMode=$('verbModeFilter').value;updateAvailability()});$('verbLength').addEventListener('change',()=>{state.filters.length=$('verbLength').value;updateAvailability()});$('startPractice').addEventListener('click',start);updateAvailability();goTop();}
  function renderVerbs(item){const tenses=['Present','Imperfet','Passat simple','Passat perifràstic','Perfet','Plusquamperfet','Futur','Futur perfet','Condicional simple','Condicional perfet'];questionShell(`<p class="exercise-kicker">Verbs · Analitza tota la forma marcada</p><h2 class="question-label">Tria les cinc característiques.</h2><p class="sentence">${markedSentence(item.sentence)}</p><form id="verbForm"><div class="filter-row verb-answer-grid"><label>Temps<select id="verbTense" required>${options([['','Selecciona el temps'],...tenses.map(t=>[t,t])],'')}</select></label><label>Aspecte<select id="verbAspect" required>${options([['','Selecciona l’aspecte'],['Perfectiu','Perfectiu'],['Imperfectiu','Imperfectiu']],'')}</select></label><label>Mode<select id="verbMode" required>${options([['','Selecciona el mode'],['Indicatiu','Indicatiu'],['Subjuntiu','Subjuntiu'],['Imperatiu','Imperatiu']],'')}</select></label></div><div class="verb-sliders"><div class="verb-slider"><label for="verbConjugation">Conjugació <output id="verbConjugationValue" for="verbConjugation">Selecciona la conjugació</output></label><input type="range" id="verbConjugation" min="0" max="3" step="1" value="0" aria-valuetext="Selecciona la conjugació"><div class="verb-slider-ticks" aria-hidden="true"><span>Tria</span><span>1a</span><span>2a</span><span>3a</span></div></div><div class="verb-slider"><label for="verbPerson">Persona i nombre <output id="verbPersonValue" for="verbPerson">Selecciona la persona</output></label><input type="range" id="verbPerson" min="0" max="6" step="1" value="0" aria-valuetext="Selecciona la persona"><div class="verb-slider-ticks" aria-hidden="true"><span>Tria</span><span>1a sg.</span><span>2a sg.</span><span>3a sg.</span><span>1a pl.</span><span>2a pl.</span><span>3a pl.</span></div></div></div><p class="input-note" id="verbRequired" role="status">Es valoren les cinc tries per separat. Mou els dos lliscadors; també pots usar les fletxes del teclat.</p><button class="primary" id="checkVerb" type="submit">Comprovar</button></form>`,`<button class="secondary" id="showHint">Recordar el criteri</button>`);
    for(const [id,output,label] of [['verbConjugation','verbConjugationValue',value=>value==='0'?'Selecciona la conjugació':value+'a conjugació'],['verbPerson','verbPersonValue',value=>verbPersons[Number(value)]||'Selecciona la persona']]){$(id).addEventListener('input',()=>{const text=label($(id).value);$(output).textContent=text;$(id).setAttribute('aria-valuetext',text)});}

    $('verbForm').addEventListener('submit',e=>{e.preventDefault();if(state.answered)return;const fields=[['Temps','verbTense',item.tense,item.tense],['Aspecte','verbAspect',item.aspect,item.aspect],['Mode','verbMode',item.mode,item.mode],['Conjugació','verbConjugation',item.conjugation,item.conjugationLabel],['Persona','verbPerson',item.person,item.personLabel]];if(fields.some(([,id])=>!$(id).value||$(id).value==='0')){$('verbRequired').textContent='Completa els tres selectors i mou els dos lliscadors abans de comprovar.';return;}let count=0;const selected=fields.map(([,id])=>$(id).value);const lines=fields.map(([label,id,answer,answerLabel])=>{const ok=$(id).value===answer;if(ok)count++;$(id).disabled=true;$(id).setAttribute('aria-invalid',String(!ok));const user=id==='verbPerson'?verbPersons[Number($(id).value)]:id==='verbConjugation'?$(id).value+'a conjugació':$(id).value;return `<li><b>${ok?'✓':'↺'} ${label}:</b> ${esc(answerLabel)}${ok?'':` <span>(has triat: ${esc(user)})</span>`}</li>`});$('checkVerb').hidden=true;finish(item,count,5,selected,`<ul class="verb-corrections">${lines.join('')}</ul><p>${esc(item.explanation)}</p><p class="source-line">Temps i aspecte: criteri escolar indicat en esta pràctica. Conjugació: AVL, GNV §29.1.</p>`,item.answer);});}

  function pool(){if(state.module==='verbs')return DATA.verbs.filter(x=>!state.filters.verbMode||state.filters.verbMode==='all'||x.mode===state.filters.verbMode);if(state.module==='phonetics')return DATA.phonetics.items.filter(x=>(state.filters.vowel==='all'||x.vowel===state.filters.vowel)&&(state.filters.rule==='all'||x.rule===state.filters.rule)&&(state.filters.kind==='all'||(state.filters.kind==='exceptions'?x.exception:!x.exception)));if(state.module==='pronouns')return (state.type==='texts'?DATA.pronouns.texts:DATA.pronouns.items.filter(x=>state.filters.group==='all'||x.group===state.filters.group)).filter(x=>!state.filters.difficulty||state.filters.difficulty==='all'||x.level===state.filters.difficulty);return DATA.literature.filter(x=>state.filters.topic==='all'||x.topic===state.filters.topic)}
  function setup(module){if(module==='verbs')return setupVerbs();state.module=module;state.filters.length=10;setNav(module);const m=modules[module];$('app').innerHTML=`${module==='literature'?`<section class="fragment-entry"><div><h2>Fragments i preguntes d’examen</h2><p>10 lectures · 40 preguntes · Resposta lliure i models amb proves del text.</p></div><button id="openFragmentLibrary" class="primary">Practicar amb fragments →</button></section>`:''}<section class="section-heading"><p class="eyebrow">${m.label}</p><h1>${module==='phonetics'?'Oberta o tancada?':module==='pronouns'?'Cada pronom té un referent.':'Coneixes Rodoreda?'}</h1><p class="lead">${module==='phonetics'?'Decidix com sona la vocal marcada. La correcció explica la norma i les excepcions.':module==='pronouns'?'Exercicis originals de nivell de 2n de Batxillerat, amb antecedents i correcció raonada.':'Repàs de context, biografia, obra, influències, estructura, narrador, personatges i símbols.'}</p></section><section class="setup-card"><div class="section-label"><span>01</span><h2>Prepara la pràctica</h2></div>${module==='pronouns'?`<div class="mode-tabs" role="group" aria-label="Tipus d’exercici"><button data-type="substitution" class="${state.type==='substitution'?'active':''}">Substituir complements</button><button data-type="texts" class="${state.type==='texts'?'active':''}">Textos amb buits</button></div>`:''}<div class="filter-row">${module==='pronouns'?`<label>Dificultat<select id="difficultyFilter">${options([['all','Tots els nivells'],['base','Base PAU'],['advanced','Reforç PAU: combinacions i context']],state.filters.difficulty||'all')}</select></label>`:''}${module==='phonetics'?`<label>Vocal<select id="vowelFilter">${options([['all','E i O'],['e','Només E'],['o','Només O']],state.filters.vowel)}</select></label><label>Família de normes<select id="ruleFilter">${options([['all','Totes les normes'],...Object.entries(DATA.phonetics.rules).map(([id,r])=>[id,r.title])],state.filters.rule)}</select></label><label>Tipus<select id="kindFilter">${options([['all','Normes i excepcions'],['rules','Aplicacions de norma'],['exceptions','Només excepcions']],state.filters.kind)}</select></label>`:module==='pronouns'?`<label ${state.type==='texts'?'hidden':''}>Funció o aspecte<select id="groupFilter">${options([['all','Tots els tipus'],...[...new Set(DATA.pronouns.items.map(x=>x.group))].map(x=>[x,x])],state.filters.group)}</select></label>`:`<label>Bloc dels apunts<select id="topicFilter">${options([['all','Tot el temari'],...[...new Set(DATA.literature.map(x=>x.topic))].map(x=>[x,x])],state.filters.topic)}</select></label>`}<label>Ronda<select id="lengthFilter">${options([[10,'10 exercicis'],[20,'20 exercicis'],['all','Tots els disponibles']],state.filters.length)}</select></label></div><div class="setup-bottom"><span id="availableCount" role="status"></span><button class="primary" id="startPractice">Començar</button></div></section>${module==='phonetics'?`<div class="study-notes"><details><summary>Un recordatori abans de començar</summary><p>L’accent gràfic i el timbre no són sempre equivalents. En el model valencià general, València, què, perquè, sèrie i època tenen E tancada encara que duguen accent greu.</p><p>Si una paraula té més d’un significat, el context t’ajuda a interpretar-la. La vocal que cal analitzar apareix marcada.</p></details><details><summary>Consultar les 23 famílies de normes</summary><div class="rule-library">${Object.values(DATA.phonetics.rules).map(r=>`<article><h3>${esc(r.title)}</h3><p>${esc(r.hint)}</p></article>`).join('')}</div></details></div>`:module==='pronouns'?`<aside class="mini-note"><b>Com corregim?</b><p>En substitució, escriu tota l’oració i conserva el sentit. En els textos, escriu només la forma que falta, amb l’apòstrof o el guionet quan calga. S’accepten les alternatives normatives previstes.</p><p>Les combinacions es practiquen amb les formes valencianes generals: <b>li’l, li la, li ho, li’n, els els</b>.</p></aside>`:`<aside class="mini-note"><b>Un detall important sobre les dates</b><p>S’han contrastat amb la Fundació Mercè Rodoreda: <i>El carrer de les Camèlies</i> (1966), <i>Jardí vora el mar</i> (1967) i l’edició pòstuma de <i>La mort i la primavera</i> (1986). Estes dates corregixen les errades del resum.</p></aside>`}`;

  function updateAvailability(){const count=pool().length;const requested=state.filters.length==='all'?count:Number(state.filters.length);const actual=Math.min(requested,count);$('availableCount').textContent=count?`${count} disponibles · esta ronda: ${actual}${state.module==='pronouns'&&state.type==='texts'?' textos':''}`:'No hi ha exercicis amb estos filtres. Prova una altra combinació.';$('startPractice').disabled=!count}

  function questionShell(body,foot=''){const m=modules[state.module];$('app').innerHTML=`<div class="practice-top"><button class="back-button" id="backSetup">‹ Configurar pràctica</button><span class="practice-label">${m.name}</span></div><div class="practice-progress"><span>Exercici <b>${state.index+1}</b> de ${state.deck.length}</span><span>${state.correct} encerts / ${state.total} corregits</span></div><div class="progress-line"><span style="width:${100*state.index/state.deck.length}%"></span></div><section class="exercise-card ${m.color}">${body}<div id="hintBox" class="hint-box" hidden></div><div id="feedback" class="feedback" role="status" aria-live="polite" hidden></div><div class="exercise-actions">${foot}<button class="primary" id="nextQuestion" hidden>${state.index===state.deck.length-1?'Veure resultat':'Següent'}</button></div></section>`;$('backSetup').addEventListener('click',()=>setup(state.module));$('nextQuestion').addEventListener('click',()=>{state.index++;if(state.index>=state.deck.length)summary();else renderQuestion();goTop()})}

  function renderPhonetics(item){const marked=esc(item.word.slice(0,item.index))+`<mark>${esc(item.word[item.index])}</mark>`+esc(item.word.slice(item.index+1));const symbols=item.vowel==='e'?['ɛ','e']:['ɔ','o'];questionShell(`<p class="exercise-kicker">Fonètica · Vocal ${item.vowel.toUpperCase()}</p><h2 class="question-label">Com sona la vocal marcada?</h2><div class="phonetic-word">${marked}</div>${item.context?`<p class="word-context">${esc(item.context)}</p>`:''}<div class="sound-options"><button class="sound-button" data-sound="oberta"><span>[${symbols[0]}]</span><b>Oberta</b></button><button class="sound-button" data-sound="tancada"><span>[${symbols[1]}]</span><b>Tancada</b></button></div>`,`<button class="secondary" id="showHint">Llegir la norma</button>`);$('showHint').addEventListener('click',()=>hint(DATA.phonetics.rules[item.rule].hint));document.querySelectorAll('[data-sound]').forEach(button=>button.addEventListener('click',()=>{if(state.answered)return;document.querySelectorAll('[data-sound]').forEach(b=>{b.disabled=true;b.classList.toggle('right',b.dataset.sound===item.answer);b.classList.toggle('wrong',b===button&&b.dataset.sound!==item.answer)});const explain=`<span class="answer-tag">${item.exception?'Excepció':'Norma'}</span><p>${esc(item.explanation)}</p><p class="source-line">${esc(item.source)}</p><a href="https://www.avl.gva.es/lexicval/" target="_blank" rel="noopener">Consultar el diccionari de l’AVL</a>`;finish(item,button.dataset.sound===item.answer?1:0,1,button.dataset.sound,explain,`${item.answer==='oberta'?'Oberta':'Tancada'} [${item.vowel==='e'?(item.answer==='oberta'?'ɛ':'e'):(item.answer==='oberta'?'ɔ':'o')}]`)}))}
  function renderLiterature(item){state.choices=shuffle(item.options.map(text=>({text,correct:text===item.answer})));questionShell(`<p class="exercise-kicker">${esc(item.topic)}</p><h2 class="literature-question">${esc(item.prompt)}</h2><div class="test-options">${state.choices.map((option,i)=>`<button class="test-option" data-choice="${i}"><span>${'ABCD'[i]}</span><b>${esc(option.text)}</b></button>`).join('')}</div>`);document.querySelectorAll('[data-choice]').forEach(button=>button.addEventListener('click',()=>{if(state.answered)return;const choice=state.choices[Number(button.dataset.choice)];document.querySelectorAll('[data-choice]').forEach(b=>{b.disabled=true;b.classList.toggle('right',state.choices[Number(b.dataset.choice)].correct);b.classList.toggle('wrong',b===button&&!choice.correct)});finish(item,choice.correct?1:0,1,choice.text,`<p>${esc(item.explanation)}</p><p class="source-line">${esc(item.source)}</p>`,item.answer)}))}

  function renderText(item){const text=item.text.split(/(\{\{\d+\}\})/g).map(part=>/^\{\{\d+\}\}$/.test(part)?`<input class="gap-input" id="gap-${part.slice(2,-2)}" data-gap="${part.slice(2,-2)}" type="text" required autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Buit ${Number(part.slice(2,-2))+1}" placeholder="${Number(part.slice(2,-2))+1}">`:esc(part)).join('');questionShell(`<p class="exercise-kicker">Pronoms febles · Text i antecedents</p><h2 class="literature-question">${esc(item.title)}</h2><p class="input-note">Escriu només la forma que falta. Si va darrere del verb, inclou el guionet o l’apòstrof.</p><form id="textForm"><div class="gap-text">${text}</div><button class="primary" id="checkText" type="submit">Corregir els buits</button></form>`,`<button class="secondary" id="showHint">Com trobar el referent</button>`);$('showHint').addEventListener('click',()=>hint('Busca en les frases anteriors a qui o a què es referix cada buit. Decidix si és un CD definit, un partitiu, un CI, una idea neutra o un lloc; després revisa la vocal inicial del verb.'));$('textForm').addEventListener('submit',e=>{e.preventDefault();if(state.answered)return;const inputs=item.slots.map((_,i)=>$('gap-'+i));if(inputs.some(input=>!norm(input.value)))return;const user=inputs.map(input=>input.value);let correct=0;const rows=item.slots.map((slot,i)=>{const ok=slot.answers.some(answer=>norm(answer)===norm(user[i]));if(ok)correct++;inputs[i].readOnly=true;inputs[i].classList.add(ok?'gap-right':'gap-wrong');inputs[i].setAttribute('aria-invalid',String(!ok));return `<li><b>${i+1}. ${esc(slot.answers[0])}</b><span>Referent: ${esc(slot.reference)}</span><p>${esc(slot.explanation)}</p><small>${ok?'✓ Correcte':'Cal revisar-lo'}</small></li>`});$('checkText').hidden=true;finish(item,correct,item.slots.length,user,`<ol class="gap-corrections">${rows.join('')}</ol>`,'')})}
  function summary(){const percent=state.total?Math.round(100*state.correct/state.total):0;const wrong=state.results.filter(r=>r.correct<r.total);$('app').innerHTML=`<section class="summary-card"><div class="summary-seal" aria-hidden="true">✓</div><p class="eyebrow">Pràctica acabada</p><h1>${percent===100?'Ho tens!':'Cada correcció compta.'}</h1><div class="summary-score"><strong>${state.correct}<small> / ${state.total}</small></strong><span>respostes correctes · ${percent}%</span></div><p>${state.deck.length} exercicis completats · ${state.hints} pistes consultades</p><div class="summary-actions"><button class="primary" id="tryAgain">Una altra ronda</button><button class="secondary" id="changeSetup">Canviar filtres</button></div></section>${wrong.length?`<section class="review-list"><h2>Per a repassar</h2>${wrong.map(r=>`<details><summary>${esc(r.item.word||r.item.prompt||r.item.title||r.item.sentence.replace(/[{}]/g,''))}</summary>${r.answer?`<p><b>${esc(r.answer)}</b></p>`:''}<div>${r.explanation}</div></details>`).join('')}</section>`:'<p class="all-good">Has resolt tota la ronda. Pots ampliar els filtres per a continuar.</p>'}`;$('tryAgain').addEventListener('click',start);$('changeSetup').addEventListener('click',()=>setup(state.module));goTop()}
  function sources(){$('currentSection').textContent='Fonts i criteri';$('app').innerHTML=`<section class="section-heading"><p class="eyebrow">Per què esta és la resposta?</p><h1>Materials i contrast.</h1><p class="lead">Exercicis originals elaborats a partir dels teus materials de classe i de fonts lingüístiques de referència.</p></section><div class="sources-grid"><article class="source-card"><h2>Fonètica</h2><p>La guia pegada és el punt de partida. S’ha contrastat amb la <i>Gramàtica normativa valenciana</i> de l’AVL, especialment §§ 1.2.1.3 i 5.1.2.</p><p>El timbre s’avalua segons el model valencià general. S’han evitat casos amb variació dialectal que no es puga resoldre amb el context.</p><p>La GNV dona O oberta en <i>elogi, lògica i odi</i>. En <i>València, què, perquè, sèrie i època</i>, la E valenciana general és tancada malgrat l’accent greu.</p><a href="https://www.avl.gva.es/lexicval/" target="_blank" rel="noopener">Diccionari normatiu valencià · AVL</a><a href="https://www.upv.es/entidades/spnl/wp-content/uploads/2023/11/gramatica_normativa_valenciana.pdf" target="_blank" rel="noopener">Gramàtica normativa valenciana · AVL</a></article><article class="source-card"><h2>Pronoms febles i verbs</h2><p>Els exercicis de reforç són originals i treballen combinacions binàries, posició i antecedents. Els verbs identifiquen cinc camps. Segons el criteri escolar triat, l’imperatiu és present i imperfectiu; els compostos i passats simple o perifràstic són perfectius i la resta, imperfectius.</p><a href="https://geiec.iec.cat/text/20.3" target="_blank" rel="noopener">IEC · Temps i aspecte verbal</a><a href="https://www.uv.es/splweb/Documentos/gramatica_zero.pdf" target="_blank" rel="noopener">UV · Gramàtica zero: combinacions valencianes</a><p>Material aportat: <i>RESUM PRONOMS FEBLES.pdf</i>, de 2n de Batxillerat. Els exercicis són originals: no són una reproducció d’un examen oficial.</p><p>El format combina substitució de complements i buits contextuals, com en les pràctiques de formació lingüística de la UPV i en la preparació de Batxillerat.</p><p>S’ha contrastat la combinació valenciana amb LI i la posició de l’apòstrof amb la GNV, capítols 22 i 23. S’accepten les alternatives recollides en cada solució.</p><a href="https://www.upv.es/entidades/spnl/wp-content/uploads/2023/12/exercicis_morfosintaxi_003.pdf" target="_blank" rel="noopener">UPV · Exercicis de pronoms febles</a><a href="https://www.uv.es/pau/es" target="_blank" rel="noopener">Universitat de València · Portal PAU</a></article><article class="source-card"><h2>Mercè Rodoreda</h2><p>Material aportat: <i>APUNTS NARRATIVA. MERCÈ RODOREDA (2).pdf</i>, 12 pàgines. El test cobrix les huit àrees temàtiques del resum.</p><p>Les interpretacions de personatges i símbols seguixen els apunts.</p><p>La pràctica escrita incorpora deu fragments del llibre aportat, quaranta preguntes originals basades en <i>Exemples preguntes literatura.pptx.pdf</i> i models de 75-80 paraules. La numeració de pàgines remet al PDF del llibre i els capítols es comproven en eixa còpia.</p><p> Les dates bibliogràfiques s’han contrastat amb la Fundació Mercè Rodoreda: <i>El carrer de les Camèlies</i>, 1966; <i>Jardí vora el mar</i>, 1967; <i>La mort i la primavera</i>, edició pòstuma de 1986.</p><a href="https://www.mercerodoreda.cat/biografia" target="_blank" rel="noopener">Fundació Mercè Rodoreda · Biografia</a><a href="https://www.escriptors.cat/index.php/autors/rodoredam/biografia-merce-rodoreda" target="_blank" rel="noopener">AELC · Biografia i trajectòria</a></article></div><button id="sourcesHome" class="secondary">Tornar a l’inici</button>`;$('sourcesHome').addEventListener('click',home);goTop()}
  $('homeButton').addEventListener('click',home);$('sourcesButton').addEventListener('click',sources);document.querySelectorAll('[data-module]').forEach(button=>button.addEventListener('click',()=>setup(button.dataset.module)));home();
})();

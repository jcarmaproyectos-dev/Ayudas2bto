lies OSA, OSSA i OST","hint":"Molts mots en -osa, -ossa i -ost/-osta tenen O oberta; hi ha grups d’excepcions que convé memoritzar.","pattern":"Terminacions -osa, -ossa, -ost i -osta."},"o-t":{"title":"Família OT","hint":"La O tònica de moltes paraules en -ot/-ota és oberta, amb excepcions lèxiques.","pattern":"Terminacions -ot i -ota."},"o-altres":{"title":"OC, OFA, OIG i PONDRE","hint":"La O sol ser oberta en estes famílies: -oc/-oca, -ofa, -oig/-oja i -pondre. Comprova les excepcions.","pattern":"Grups -oc, -oca, -ofa, -oig, -oja o -pondre."},"atona":{"title":"Vocal àtona","hint":"En el model valencià general, una E o una O àtona es realitza habitualment tancada. Abans d’aplicar altres tendències, localitza la síl·laba tònica.","pattern":"La vocal marcada no pertany a la síl·laba tònica."}},"items":[{"id":"f000","word":"acadèmia","index":4,"vowel":"e","answer":"oberta","rule":"e-iu","exception":false,"context":"","note":"","explanation":"Aplicació de la norma. E tònica seguida d’una síl·laba amb I o U. En este mot, la vocal marcada és oberta.","source":"GNV (AVL), §§ 1.2.1.3 i 5.1.2; contrast amb la guia aportada."},{"id":"f001","word":"conveni","index":4,"vowel":"e","answer":"oberta","rule":"e-iu","exception":false,"context":"","note":"","explanation":"Aplicació de la norma. E tònica seguida d’una síl·laba amb I o U. En este mot, la vocal marcada és oberta.","source":"GNV (AVL), §§ 1.2.1.3 i 5.1.2; contrast amb la guia aportada."},{"id":"f002","word":"incendi","index":3,"vowel":"e","answer":"oberta","rule":"e-iu","exception":false,"context":"","note":"","explanation":"Aplicació de la norma. E tònica seguida d’una síl·laba amb I o U. En este mot, la vocal marcada és oberta.","source":"GNV (AVL), §§ 1.2.1.3 i 5.1.2; contrast amb la guia aportada."},{"id":"f003","word":"misteri","index":4,"vowel":"e","answer":"oberta","rule":"e-iu","exception":false,"context":"","note":"","explanation":"Aplicació de la norma. E tònica seguida d’una síl·laba amb I o U. En este mot, meral dues."},{"answers":["els"],"reference":"als músics","explanation":"CI plural: els."},{"answers":["les"],"reference":"les invitacions","explanation":"CD femení plural: les."},{"answers":["en"],"reference":"de la festa anterior","explanation":"Indica de quina festa són les anècdotes; no substituïx tot el CD definit."}],"level":"base"},{"id":"t06","title":"Una conversa abans de l’examen","text":"Joan està nerviós; sempre {{0}} està abans d’una prova. Pensa en les preguntes i no para de pensar{{1}}. Laia li diu que tot anirà bé, però ell no {{2}} creu. Té dos dubtes: la professora {{3}} resoldrà un. Al final, dels errors de l’última prova, ja no {{4}} parla.","slots":[{"answers":["ho"],"reference":"nerviós","explanation":"Atribut de estar: ho."},{"answers":["-hi"],"reference":"en les preguntes","explanation":"CRV amb en: hi, que darrere de pensar s’unix amb guionet."},{"answers":["ho"],"reference":"que tot anirà bé","explanation":"CD oracional: ho."},{"answers":["li'n"],"reference":"un dubte a Joan","explanation":"CI li + partitiu en, amb conservació de un."},{"answers":["en"],"reference":"dels errors","explanation":"Règim de parlar de: en."}],"level":"base"},{"id":"t07","title":"A la llibreria","text":"Busque un diccionari. La llibretera {{0}} recomana un de nou. M’agrada la portada i vull mirar{{1}} amb calma. A les meues germanes, {{2}} agraden els contes il·lustrats. Jo {{3}} compraré dos per a elles. Del llibre que hem triat, encara {{4}} parlarem durant una estona.","slots":[{"answers":["me'n"],"reference":"un diccionari a mi","explanation":"CI em + CD partitiu en: me’n."},{"answers":["-la"],"reference":"la portada","explanation":"CD femení definit darrere de l’infinitiu: -la."},{"answers":["els"],"reference":"a les meues germanes","explanation":"CI plural sense distinció de gènere: els."},{"answers":["en"],"reference":"dos contes il·lustrats","explanation":"Partitiu en amb el numeral dos."},{"answers":["en"],"reference":"del llibre que hem triat","explanation":"El complement temàtic amb de de parlar es representa amb en."}],"level":"base"},{"id":"ta8","level":"advanced","title":"La coordinació del treball","text":"La tutora vol les fitxes. Demà {{0}} portarem; és a ella a qui les hem de donar. També necessita tres còpies del resum: {{1}} farem tres. Els delegats volen saber si podem acabar hui: {{2}} direm que sí. El dossier, l’hem de deixar a secretaria; demà {{3}} deixarem. De les fonts, {{4}}hem parlat amb la tutora. A secretaria, de dossiers antics, {{5}} ha dos.","slots":[{"answers":["li les"],"reference":"les fitxes a la tutora","explanation":"CI singular li + CD femení plural les."},{"answers":["li’n"],"reference":"tres còpies a la tutora","explanation":"CI li + partitiu en; tres es conserva."},{"answers":["els"],"reference":"als delegats","explanation":"Només es reemplaça el CI; la subordinada de CD està escrita després."},{"answers":["l’hi"],"reference":"el dossier a secretaria","explanation":"CD el + lloc hi davant de deixarem: l’hi."},{"answers":["n’"],"reference":"de les fonts","explanation":"Parlar de: en elidit davant d’hem."},{"answers":["n’hi"],"reference":"dos dossiers que hi ha","explanation":"Partitiu en combinat amb el hi d’haver-hi."}]},{"id":"ta9","level":"advanced","title":"El préstec de la biblioteca","text":"La bibliotecària ens recomana dues novel·les. Si volem llegir-les, {{0}} pot prestar dues. A la professora també li interessa una de les novel·les: jo {{1}} deixaré quan acabe de llegir-la. Als meus cosins els agraden els còmics i {{2}} recomanaré dos. Els còmics, vull deixar-los a la prestatgeria: demà {{3}} posaré. De la lectura, sempre {{4}} parle amb els amics. Quan em pregunten si m’agrada llegir, {{5}} conteste que sí.","slots":[{"answers":["ens en"],"reference":"dues novel·les a nosaltres","explanation":"CI ens + CD partitiu en."},{"answers":["li la"],"reference":"la novel·la a la professora","explanation":"CI li + CD la davant de consonant."},{"answers":["els en"],"reference":"dos xt i corrents","page":1,"prompt":"Quina funció exerciren els cursos de Lo Rat Penat en la postguerra?","options":["Conservar i transmetre la llengua","Substituir la narrativa per cinema comercial","Implantar la censura editorial","Promoure exclusivament la literatura en castellà"],"answer":"Conservar i transmetre la llengua","explanation":"Els cursos de llengua s’integren en les iniciatives de resistència cultural.","source":"Apunts de narrativa, pàgina 1"},{"id":"r004","topic":"Context i corrents","page":2,"prompt":"Quin any coincidixen Edicions 62, Nosaltres, els valencians i La plaça del Diamant?","options":["1962","1939","1954","1975"],"answer":"1962","explanation":"Els tres fets són una fita de la represa editorial i cultural dels anys seixanta.","source":"Apunts de narrativa, pàgina 2"},{"id":"r005","topic":"Context i corrents","page":2,"prompt":"Quin tret caracteritza la novel·la psicològica?","options":["La prioritat del món interior, la memòria i les emocions","L’eliminació de tota subjectivitat","L’obligació de narrar només fets documentats","La substitució dels personatges per dades estadístiques"],"answer":"La prioritat del món interior, la memòria i les emocions","explanation":"L’acció exterior s’interpreta a través de la consciència i la vida emocional dels personatges.","source":"Apunts de narrativa, pàgina 2"},{"id":"r006","topic":"Context i corrents","page":2,"prompt":"Quina parella s’associa en els apunts amb la novel·la psicològica?","options":["Mercè Rodoreda i Llorenç Villalonga","Pere Calders i Joan Perucho","Joan Fuster i Carles Salvador","Josep Lozano i Jaume Cabré"],"answer":"Mercè Rodoreda i Llorenç Villalonga","explanation":"Són dos dels grans representants del model psicològic en la narrativa de postguerra.","source":"Apunts de narrativa, pàgina 2"},{"id":"r007","topic":"Context i corrents","page":2,"prompt":"Quin objectiu és propi del realisme objectivista-social?","options":["Testimoniar el context i denunciar injustícies","Excloure qualsevol dimensió col·lectiva","Reproduir només somnis sense context","Defensar que la realitat social no afecta els personatges"],"answer":"Testimoniar el context i denunciar injustícies","explanation":"El realisme social mostra les condicions de vida i les tensions del present històric.","source":"Apunts de narrativa, pàgina 2"},{"id":"r008","topic":"Context i corrents","page":2,"prompt":"A quin corrent vinculen els apunts Pere Calders?","options":["Fantasia, humor i ironia","Naturalisme documental estricte","Novel·la cavalleresca medieval","Narrativa sense cap element imaginari"],"answer":"Fantasia, humor i ironia","explanation":"La fantasia i l’absurd poden servir per a qüestionar la realitat, no sols per a evadir-se’n.","source":"Apunts de narrativa, pàgina 2"},{"id":"r009","topic":"Context i corrents","page":2,"prompt":"Quin autor representa la pervivència del realisme tradicional?","options":["Enric Valor","James Joyce","Alain Robbe-Grillet","Franz Kafka"],"answer":"Enric Valor","explanation":"Els apunts remarquen la continuïtat del realisme tradicional en l’obra d’Enric Valor.","source":"Apunts de narrativa, pàgina 2"},{"id":"r010","topic":"Context i corrents","page":2,"prompt":"Què afavorix la normalització del circuit literari amb la democràcia?","options":["La cooficialitat, l’escola i el creixement editorial","La desaparició de les llibreries","La prohibició dels premis literaris","El retorn a la clandestinitat com a única via"],"answer":"La cooficialitat, l’escola i el creixement editorial","explanation":"L’ampliació dels espais públics de la llengua reforça el públic lector i la indústria editorial.","source":"Apunts de narrativa, pàgina 2"},{"id":"r011","topic":"Context i corrents","page":2,"prompt":"Quin recurs és propi de la narrativa experimental dels setanta?","options":["Fragmentació i ruptura de les convencions narratives","Narrador sempre omniscient i cronologia obligatòria","Desenllaç sempre tancat i moralitzador","Prohibició de combinar imatge a plaça del Diamant i El voyeur"],"answer":"Crim de germania i La teranyina","explanation":"Josep Lozano i Jaume Cabré exemplifiquen la recuperació narrativa de la història.","source":"Apunts de narrativa, pàgina 3"},{"id":"r016","topic":"Context i corrents","page":3,"prompt":"Què afavorí el creixement de memòries i dietaris?","options":["La fi de la censura i la revisió de guerra i postguerra","La prohibició de parlar en primera persona","La desaparició de l’interés pel passat","Una obligació de narrar només ciència-ficció"],"answer":"La fi de la censura i la revisió de guerra i postguerra","explanation":"La literatura testimonial troba més llibertat per a explicar experiències abans silenciades.","source":"Apunts de narrativa, pàgina 3"},{"id":"r017","topic":"Context i corrents","page":3,"prompt":"Quin concepte definix la convivència actual de molts gèneres i models?","options":["Eclecticisme","Uniformitat obligatòria","Monolingüisme literari","Exclusió dels gèneres populars"],"answer":"Eclecticisme","explanation":"Conviuen realisme, experimentació i gèneres com el policíac, l’històric o el fantàstic.","source":"Apunts de narrativa, pàgina 3"},{"id":"r018","topic":"Context i corrents","page":3,"prompt":"Quines autores valencianes de postguerra es destaquen?","options":["Carmelina Sánchez-Cutillas i Beatriu Civera","Bel Olid i Najat El Hachmi","Maria Barbal i Maria Mercè Roca","Virginia Woolf i Simone de Beauvoir"],"answer":"Carmelina Sánchez-Cutillas i Beatriu Civera","explanation":"Els apunts les situen entre les narradores valencianes de postguerra.","source":"Apunts de narrativa, pàgina 3"},{"id":"r019","topic":"Context i corrents","page":3,"prompt":"Quina crítica compartixen moltes narradores dels setanta?","options":["La submissió femenina i la maternitat imposada","La llibertat de decidir de les dones","La igualtat jurídica com a problema principal","L’accés de les dones a la cultura com a amenaça"],"answer":"La submissió femenina i la maternitat imposada","explanation":"Qüestionen els rols domèstics, la passivitat exigida i la moral sexual repressora.","source":"Apunts de narrativa, pàgina 3"},{"id":"r020","topic":"Context i corrents","page":3,"prompt":"Quina escriptora usa el pseudònim Víctor Català?","options":["Caterina Albert","Dolors Monserdà","Mercè Rodoreda","Isabel-Clara Simó"],"answer":"Caterina Albert","explanation":"Caterina Albert figura entre les narradores anteriors a 1936.","source":"Apunts de narrativa, pàgina 3"},{"id":"r021","topic":"Context i corrents","page":3,"prompt":"Quina parella continua la petjada psicologista de Rodoreda?","options":["Carme Riera i Montserrat Roig","Joan Fuster i Joan Sales","Pere Calders i Joan Perucho","James Joyce i Franz Kafka"],"answer":"Carme Riera i Montserrat Roig","explanation":"Els apunts remarquen la influència rodorediana en estes escriptores.","source":"Apunts de narrativa, pàgina 3"},{"id":"r022","topic":"Context i corrents","page":3,"prompt":"Quin grup correspon a narradores actuals dels apunts?","options":["Bel Olid, Najat El Hachmi i Imma Monsó","Caterina Albert, Monserdà i Vernet","Teresa Pàmies, Capmany i Civera","Rodoreda, Murià i Bertrana"],"answer":"Bel Olid, Najat El Hachmi i Imma Monsó","explanation":"La classificació diferencia generacions i situa estes autores en el panorama més recent.","source":"Apunts de narrativa, pàgina 3"},{"id":"r023","topic":"Biografia i obra","page":4,"prompt":"On va nàixer Mercè Rodoreda?","options":["Al barri de Sant Gervasi de Barcelona","A Romanyà de la Selva","A Ginebra","A València"],"answer":"Al barri de Sant Gervasi de Barcelona","explanation":"Va nàixer a Barcelona el 1908; l’ambient de la infantesa deixa empremta en la seua obra.","source":"Apunts de narrativa, pàgina 4"},{"id":"r024","topic":"Biografia i obra","page":4,"prompt":"Quin familiar li transmeté la passió per les flors i la literatura?","options":["El seu avi Pere Gurguí","Armand Obiols","El seu fill Jordi","Joan Sales"],"answer":"El seu avi Pere Gurguí","explanation":"L’avi és una influència fonamental de la infantesa; el jardí esdevindrà un espai simbòlic.","source":"Apunts de narrativa, pàgina 4"},{"id":"r025","topic":"Biografia i obra","page":4,"prompt":"Com fou la seua escolarització infantil?","options":["Breu, aproximadament entre els set i els deu anys","Universitària des dels deu anys","Ininterrompuda fins als vint-i-cinc anys","Exclusivament a França des del naixement"],"answer":"Breu, aproximadament entre els set i els deu anys","explanation":"La formació reglada fou curta i la lectura tingué un paper central en la seua educació.","source":"Apunts de narrativa, pàgina 4"},{"id":"r026","topic":"Biografia i obra","page":4,"prompt":"Quina novel·la primerenca acceptà recuperar i reescriure?","options":["Aloma","Crim","Soc una dona honrada?","Del que hom no pot fugir"],"answer":"Aloma","explanation":"Rebutjà les primeres novel·les, amb l’excepció d’Aloma, que reescriví en la maduresa.","source":"Apunts de narrativa, pàgina 4"},{"id":"r027","topic":"Biografia i obra","page":4,"prompt":"Què provoca l’exili de Rodoreda el 1939?","options":["La imminent victòria franquista","Una beca de turisme literari","L’èxit comercial de Mirall trencat","Un viatge voluntari de jubilació"],"answer":"La imminent victòria franquista","explanation":"L’exili s’inscriu en la fugida d’intel·lectuals vinculats al món cultural republicà.","source":"Apunts de narrativa, pàgina 4"},{"id":"r028","topic":"Biografia i obra","page":4,"prompt":"Quina ciutat suïssa és decisiva en la seua maduresa literària?","options":["Ginebra","Zuric","Basilea","Berna"],"answer":"Ginebra","explanation":"Des de 1954, Ginebra oferix una etapa de més estabilitat i intensa producció.","source":"Apunts de narrativa, pàgina 4"},{"id":"r029","topic":"Biografia i obra","page":4,"prompt":"Qui s’amaga darrere del pseudònim Armand Obiols?","options":["Joan Prat","Joan Sales","Pere Calders","Agustí Bartra"],"answer":"Joan Prat","explanation":"Joan Prat, crític i escriptor, fou una figura afectiva i un interlocutor literari fonamental.","source":"Apunts de narrativa, pàgina 4"},{"id":"r030","topic":"Biografia i obra","page":4,"prompt":"Quin recull de 1958 marca el retorn editorial després del llarg silenci?","options":["Vint-i-dos contes","Viatges i flors","Semblava de seda i altres contes","Tots els contes"],"answer":"Vint-i-dos contes","explanation":"El recull obri una etapa de consolidació narrativa durant l’exili.","source":"Apunts de narrativa, pàgina 4"},{"id":"r031","topic":"Biografia i obra","page":5,"prompt":"A quin artista s’aproxima l’estètica de la seua pintura?","options":["Paul Klee","Diego Velázquez","Joaquín Sorolla","Francisco de Goya"],"answer":"Paul Klee","explanation":"A més de narrativa i poesia, Rodoreda practicà la pintura amb una sensibilitat pròxima a les avantguardes.","source":"Apunts de narrativa, pàgina 5"},{"id":"r032","topic":"Biografia i obra","page":5,"prompt":"On s’instal·la en l’etapa final de retorn a Catalunya?","options":["Romanyà de la Selva","La plaça del Diamant","Londres","Perpinyà"],"answer":"Romanyà de la Selva","explanation":"A Romanyà recrea un entorn de jardí i natura vinculat a la memòria infantil.","source":"Apunts de narrativa, pàgina 5"},{"id":"r033","topic":"Biografia i obra","page":5,"prompt":"Quina novel·la publica el 1974?","options":["Mirall trencat","La plaça del Diamant","Aloma, primera versió","Vint-i-dos contes"],"answer":"Mirall trencat","explanation":"Mirall trencat pertany a l’etapa final de la seua trajectòria.","source":"Apunts de narrativa, pàgina 5"},{"id":"r034","topic":"Biografia i obra","page":5,"prompt":"Quina obra és pòstuma?","options":["La mort i la primavera","Mirall trencat","La plaça del Diamant","Viatges i flors"],"answer":"La mort i la primavera","explanation":"La mort i la primavera es va editar després de la mort de l’autora, el 1986; esta data corregix el 1984 del resum.","source":"Apunts de narrativa, pàgina 5"},{"id":"r035","topic":"Biografia i obra","page":5,"prompt":"Quin any es publica La plaça del Diamant?","options":["1962","1938","1954","1974"],"answer":"1962","explanation":"La publicació de 1962 consolida definitivament Rodoreda en la narrativa contemporània.","source":"Apunts de narrativa, pàgina 5"},{"id":"r036","topic":"Biografia i obra","page":4,"prompt":"Quin any es publica El carrer de les Camèlies?","options":["1966","1963","1958","1974"],"answer":"1966","explanation":"La Fundació Mercè Rodoreda confirma 1966; el 1963 que figura en els apunts és una errada.","source":"Apunts de narrativa, pàgina 4"},{"id":"r037","topic":"Biografia i obra","page":4,"prompt":"Quin any es publica Jardí vora el mar?","options":["1967","1966","1938","1980"],"answer":"1967","explanation":"La bibliografia de la Fundació confirma 1967, en lloc del 1966 que apareix en els apunts.","source":"Apunts de narrativa, pàgina 4"},{"id":"r038","topic":"Biografia i obra","page":5,"prompt":"Quin conjunt expressa millor els interessos artístics de Rodoreda?","options":["Narrativa, poesia, teatre i pintura","Únicament novel·la documental","Només assaig acadèmic","Exclusivament cinema i fotografia"],"answer":"Narrativa, poesia, teatre i pintura","explanation":"La seua activitat creativa va més enllà de les novel·les que l’han feta més coneguda.","source":"Apunts de narrativa, pàgina 5"},{"id":"r039","topic":"Influències i models","page":5,"prompt":"Amb quin autor es relaciona l’alienació de Natàlia en Colometa?","options":["Franz Kafka","Josep Pla","Carles Salvador","Àngel Guimerà"],"answer":"Franz Kafka","explanation":"La transformació del nom i la pèrdua de personalitat remeten a una lectura kafkiana de l’opressió.","source":"Apunts de narrativa, pàgina 5"},{"id":"r040","topic":"Influències i models","page":5,"prompt":"Quin aspecte de Proust influïx especialment en Rodoreda?","options":["Els mecanismes del record i la memòria sensorial","La narració sense cap record","L’exclusió dels estats d’ànim","La descripció tècnica de batalles"],"answer":"Els mecanismes del record i la memòria sensorial","explanation":"Les sensacions, com les olors, activen la memòria i la reconstrucció del passat.","source":"Apunts de narrativa, pàgina 5"},{"id":"r041","topic":"Influències i models","page":5,"prompt":"Quina novel·la de Joyce és el referent del monòleg interior?","options":["Ulisses","La metamorfosi","Le voyeur","La nàusea"],"answer":"Ulisses","explanation":"Ulisses és un referent del flux de consciència, encara que això no convertix tota l’obra de Rodoreda en monòleg interior.","source":"Apunts de narrativa, pàgina 5"},{"id":"r042","topic":"Influències i models","page":6,"prompt":"Quin tret s’associa amb Robbe-Grillet i el nouveau roman?","options":["La mirada minuciosa sobre els objectes","L’absència absoluta de descripció","L’obligació d’un narrador èpic medieval","El rebuig de qualsevol detall material"],"answer":"La mirada minuciosa sobre els objectes","explanation":"La descripció d’objectes i espais adquireix un pes propi en la construcció del relat.","source":"Apunts de narrativa, pàgina 6"},{"id":"r043","topic":"Influències i models","page":6,"prompt":"Quin corrent ajuda a interpretar els somnis i els símbols sexuals?","options":["La psicoanàlisi","El positivisme estadístic","La teoria dels quatre humors","El costumisme sense dimensió simbòlica"],"answer":"La psicoanàlisi","explanation":"Els somnis i les imatges poden expressar conflictes que no apareixen de manera directa.","source":"Apunts de narrativa, pàgina 6"},{"id":"r044","topic":"Influències i models","page":6,"prompt":"Quins autors s’associen amb l’existencialisme?","options":["Jean-Paul Sartre i Albert Camus","Pere Calders i Joan Perucho","Joan Sales i Carles Salvador","Novalis i Paul Klee"],"answer":"Jean-Paul Sartre i Albert Camus","explanation":"La desolació, l’angoixa i la responsabilitat de construir la pròpia vida són motius existencialistes.","source":"Apunts de narrativa, pàgina 6"},{"id":"r045","topic":"Influències i models","page":6,"prompt":"Què implica la llibertat en la lectura existencialista dels apunts?","options":["Construir el propi destí i assumir la responsabilitat de les decisions","Tindre un destí completament fixat abans de nàixer","No estar afectat mai pel context social","No necessitar cap decisió personal"],"answer":"Construir el propi destí i assumir la responsabilitat de les decisions","explanation":"La llibertat no elimina el conflicte: obliga a assumir el pes de les eleccions.","source":"Apunts de narrativa, pàgina 6"},{"id":"r046","topic":"Influències i models","page":6,"prompt":"Quin conte de Rodoreda es considera un embrió de La plaça del Diamant?","options":["Tarda al cinema","La meva Cristina","Viatges i flors","Crim de germania"],"answer":"Tarda al cinema","explanation":"Els apunts assenyalen este relat de Vint-i-dos contes com un precedent.","source":"Apunts de narrativa, pàgina 6"},{"id":"r047","topic":"Influències i models","page":6,"prompt":"Què fa que l’obra puga llegir-se com una novel·la iniciàtica?","options":["El canvi personal de la protagonista entre innocència i maduresa","L’absència de transformació de Natàlia","La narració d’una expedició militar","La presència obligatòria d’un heroi masculí"],"answer":"El canvi personal de la protagonista entre innocència i maduresa","explanation":"La trajectòria vital comporta una transformació de la mirada i de la identitat.","source":"Apunts de narrativa, pàgina 6"},{"id":"r048","topic":"Influències i models","page":6,"prompt":"Per què també es considera una novel·la poètica?","options":["Per la densitat de símbols, somnis i llenguatge subjectiu","Perquè està escrita tota en versos regulars","Perquè no conta cap història","Perquè renuncia a qualsevol connexió amb la realitat"],"answer":"Per la densitat de símbols, somnis i llenguatge subjectiu","explanation":"El lirisme conviu amb la representació d’una vida popular i d’un context històric.","source":"Apunts de narrativa, pàgina 6"},{"id":"r049","topic":"Influències i models","page":6,"prompt":"Quina afirmació sintetitza els patrons de La plaça del Diamant?","options":["Pot ser iniciàtica, psicològica i poètica alhora","Només pot pertànyer a un únic model","És una crònica militar sense subjectivitat","És exclusivament una novel·la de detectius"],"answer":"Pot ser iniciàtica, psicològica i poètica alhora","explanation":"Els diversos models permeten lectures complementàries de la mateixa obra.","source":"Apunts de narrativa, pàgina 6"},{"id":"r050","topic":"Argument i estructura","page":7,"prompt":"Quantes parts distingix la proposta de Neus Carbonell?","options":["Quatre","Dues","Tres","Set"],"answer":"Quatre","explanation":"Els apunts organitzen el recorregut en identitat, maternitat, revolució i alliberament.","source":"Apunts de narrativa, pàgina 7"},{"id":"r051","topic":"Argument i estructura","page":7,"prompt":"Quina seqüència correspon a les quatre parts?","options":["Identitat i alteritat; coloms i maternitat; revolució; alliberament","Exili; retorn; guerra; infantesa","Maternitat; alliberament; identitat; revolució","República; dictadura; restauració; democràcia"],"answer":"Identitat i alteritat; coloms i maternitat; revolució; alliberament","explanation":"La seqüència seguix el procés de pèrdua i recuperació de la identitat de Natàlia.","source":"Apunts de narrativa, pàgina 7"},{"id":"r052","topic":"Argument i estructura","page":7,"prompt":"Quins capítols formen la primera part?","options":["I–VI","VII–XXIV","XXV–XXXV","XXXVI–XLIX"],"answer":"I–VI","explanation":"La primera part narra la trobada amb Quimet, la ruptura amb Pere i el casament.","source":"Apunts de narrativa, pàgina 7"},{"id":"r053","topic":"Argument i estructura","page":7,"prompt":"Quin període històric s’associa amb coloms i maternitat?","options":["La Segona República","La Restauració del segle XIX","La Transició democràtica","La Primera Guerra Mundial"],"answer":"La Segona República","explanation":"Els apunts situen esta part en els anys republicans, abans de l’esclat bèl·lic.","source":"Apunts de narrativa, pàgina 7"},{"id":"r054","topic":"Argument i estructura","page":7,"prompt":"Quins capítols corresponen a La revolució?","options":["XXV–XXXV","I–VI","VII–XXIV","XXXVI–XLIX"],"answer":"XXV–XXXV","explanation":"Esta secció vincula la Guerra Civil amb una revolta personal de la protagonista.","source":"Apunts de narrativa, pàgina 7"},{"id":"r055","topic":"Argument i estructura","page":8,"prompt":"Quin període correspon a L’alliberament?","options":["La postguerra","L’edat mitjana","La Transició dels setanta","La Guerra del Francés"],"answer":"La postguerra","explanation":"El desenllaç se situa en els anys de postguerra i en la reconstrucció de la vida de Natàlia.","source":"Apunts de narrativa, pàgina 8"},{"id":"r056","topic":"Argument i estructura","page":7,"prompt":"On es coneixen Natàlia i Quimet?","options":["En un ball de les festes de Gràcia","En una clínica de Ginebra","A la botiga d’Antoni","En un refugi de França"],"answer":"En un ball de les festes de Gràcia","explanation":"La trobada a la plaça del Diamant inicia una relació que anticipa la futura subordinació.","source":"Apunts de narrativa, pàgina 7"},{"id":"r057","topic":"Argument i estructura","page":7,"prompt":"Quin és l’ofici de Natàlia a l’inici?","options":["Dependenta en una pastisseria","Mestra d’una escola rural","Adroguera propietària","Modista d’un teatre"],"answer":"Dependenta en una pastisseria","explanation":"La seua ocupació inicial forma part del món popular barceloní de la novel·la.","source":"Apunts de narrativa, pàgina 7"},{"id":"r058","topic":"Argument i estructura","page":7,"prompt":"A qui deixa Natàlia per Quimet?","options":["Pere","Antoni l’adroguer","Cintet","Vicenç"],"answer":"Pere","explanation":"Pere és el promés anterior a la trobada amb Quimet.","source":"Apunts de narrativa, pàgina 7"},{"id":"r059","topic":"Argument i estructura","page":7,"prompt":"Què expressa que Quimet li impose el nom de Colometa?","options":["La pèrdua d’identitat sota l’autoritat masculina","Una elecció plenament lliure de Natàlia","Un canvi de professió","La recuperació definitiva de la seua autonomia"],"answer":"La pèrdua d’identitat sota l’autoritat masculina","explanation":"El canvi de nom és un acte de poder sobre la identitat de la protagonista.","source":"Apunts de narrativa, pàgina 7"},{"id":"r060","topic":"Argument i estructura","page":7,"prompt":"Per què Natàlia comença a netejar cases?","options":["Per les dificultats econòmiques de la família","Perquè vol abandonar voluntàriament els fills","Perquè hereta una empresa","Per una obligació imposada per Antoni després de casar-se"],"answer":"Per les dificultats econòmiques de la família","explanation":"La precarietat obliga a sumar treball remunerat a les càrregues domèstiques.","source":"Apunts de narrativa, pàgina 7"},{"id":"r061","topic":"Argument i estructura","page":7,"prompt":"Com viu inicialment Natàlia la maternitat?","options":["Com una invasió i una càrrega que agreugen la pèrdua d’identitat","Com una experiència sempre idealitzada","Com un episodi sense efectes psicològics","Com una ruptura immediata amb Quimet"],"answer":"Com una invasió i una càrrega que agreugen la pèrdua d’identitat","explanation":"Els fills i els coloms amplien un espai d’obligacions que ella no controla.","source":"Apunts de narrativa, pàgina 7"},{"id":"r062","topic":"Argument i estructura","page":7,"prompt":"Què anuncia la seua resistència personal durant La revolució?","options":["El seu intent de desfer-se dels coloms","La decisió de criar-ne més per iniciativa pròpia","El trasllat immediat a Suïssa","L’abandó de qualsevol memòria del passat"],"answer":"El seu intent de desfer-se dels coloms","explanation":"La revolta contra la invasió dels coloms corre paral·lela a la convulsió col·lectiva.","source":"Apunts de narrativa, pàgina 7"},{"id":"r063","topic":"Argument i estructura","page":8,"prompt":"Quina ajuda inicia la recuperació de Natàlia en el moment més desesperat?","options":["Antoni li oferix treball","Quimet torna del front","Pere li envia una fortuna","La senyora Enriqueta li compra una fàbrica"],"answer":"Antoni li oferix treball","explanation":"L’oferta de treball d’Antoni obri una alternativa a la desesperació de la protagonista.","source":"Apunts de narrativa, pàgina 8"},{"id":"r064","topic":"Argument i estructura","page":8,"prompt":"Quin recurs produïx el salt de la infantesa a la joventut dels fills?","options":["Una el·lipsi temporal","Una analepsi sobre l’edat mitjana","Una descripció sense pas del temps","Un narrador nou que elimina Natàlia"],"answer":"Una el·lipsi temporal","explanation":"L’el·lipsi omet un tram de vida i condensa el pas dels anys.","source":"Apunts de narrativa, pàgina 8"},{"id":"r065","topic":"Argument i estructura","page":8,"prompt":"Quin sentit té el crit final de Natàlia?","options":["Una catarsi i un despreniment simbòlic del passat","Una orde militar de Quimet","La renúncia definitiva a tindre veu","Una simple celebració sense connexió amb la seua vida"],"answer":"Una catarsi i un despreniment simbòlic del passat","explanation":"El crit concentra el procés de purificació i recuperació personal.","source":"Apunts de narrativa, pàgina 8"},{"id":"r066","topic":"Narrador i tècnica","page":8,"prompt":"Quin tipus de narradora conta La plaça del Diamant?","options":["Una narradora protagonista en primera persona","Un narrador extern omniscient","Un narrador testimoni que mai és Natàlia","Un narrador coral en segona persona"],"answer":"Una narradora protagonista en primera persona","explanation":"Natàlia participa en els fets i els conta des de la seua pròpia memòria.","source":"Apunts de narrativa, pàgina 8"},{"id":"r067","topic":"Narrador i tècnica","page":8,"prompt":"Com és la focalització predominant?","options":["Interna i fixa","Externa i omniscient","Zero i sense cap restricció","Múltiple amb canvi constant de protagonista"],"answer":"Interna i fixa","explanation":"El món es coneix a través d’una sola consciència: la de Natàlia.","source":"Apunts de narrativa, pàgina 8"},{"id":"r068","topic":"Narrador i tècnica","page":8,"prompt":"Quina distància existix entre la narradora i els fets?","options":["La Natàlia adulta reconstruïx la vida de la Natàlia més jove","La protagonista narra abans de viure els fets","Un historiador relata la vida d’una desconeguda","No hi ha mai cap distància temporal"],"answer":"La Natàlia adulta reconstruïx la vida de la Natàlia més jove","explanation":"La memòria permet l’autoexploració del propi passat.","source":"Apunts de narrativa, pàgina 8"},{"id":"r069","topic":"Narrador i tècnica","page":9,"prompt":"Per què no és precís definir tota la novel·la com a monòleg interior?","options":["Perquè el relat sol ordenar coherentment els fets","Perquè no hi ha primera persona","Perquè no hi apareixen pensaments","Perquè la història no té personatges"],"answer":"Perquè el relat sol ordenar coherentment els fets","explanation":"Els apunts distingixen fragments de consciència d’una narració autobiogràfica globalment ordenada.","source":"Apunts de narrativa, pàgina 9"},{"id":"r070","topic":"Narrador i tècnica","page":9,"prompt":"Què representa el flux de consciència?","options":["La successió immediata i associativa dels pensaments","Una cronologia històrica impersonal","Una llista d’objectes sense subjecte","Un diàleg judicial sempre ordenat"],"answer":"La successió immediata i associativa dels pensaments","explanation":"És un concepte relacionat amb el monòleg interior i l’activitat mental.","source":"Apunts de narrativa, pàgina 9"},{"id":"r071","topic":"Narrador i tècnica","page":9,"prompt":"Què caracteritza l’escriptura parlada?","options":["La veu d’algú que sembla parlar a un interlocutor que no respon en el text","La transcripció obligatòria de dues veus equivalents","L’absència de trets orals","El relat exclusiu en vers"],"answer":"La veu d’algú que sembla parlar a un interlocutor que no respon en el text","explanation":"La tècnica crea una sensació de confidència i d’oralitat.","source":"Apunts de narrativa, pàgina 9"},{"id":"r072","topic":"Narrador i tècnica","page":9,"prompt":"Quina crítica utilitza el concepte d’escriptura parlada per a Rodoreda?","options":["Carme Arnau","Neus Carbonell","Mercè Marçal","Dolors Monserdà"],"answer":"Carme Arnau","explanation":"Els apunts atribuïxen a Carme Arnau esta formulació crítica.","source":"Apunts de narrativa, pàgina 9"},{"id":"r073","topic":"Narrador i tècnica","page":9,"prompt":"Què diferencia el monòleg autobiogràfic del monòleg interior més radical?","options":["Ordena retrospectivament les experiències de la vida","Elimina qualsevol subjectivitat","Exigix un narrador extern","No permet records"],"answer":"Ordena retrospectivament les experiències de la vida","explanation":"La confessió autobiogràfica dona coherència a allò que la protagonista ha viscut.","source":"Apunts de narrativa, pàgina 9"},{"id":"r074","topic":"Narrador i tècnica","page":9,"prompt":"Quin efecte produïx donar veu directa a Natàlia?","options":["Acostar el lector als seus sentiments sense un narrador intermedi","Garantir una veritat històrica omniscient","Eliminar tota ambigüitat","Fer irrellevant la seua percepció"],"answer":"Acostar el lector als seus sentiments sense un narrador intermedi","explanation":"La subjectivitat i la mirada personal construïxen la relació amb el lector.","source":"Apunts de narrativa, pàgina 9"},{"id":"r075","topic":"Narrador i tècnica","page":9,"prompt":"Com es pot descriure la llengua de la novel·la?","options":["Popular i col·loquial, però literàriament estilitzada","Una còpia mecànica sense elaboració artística","Exclusivament científica i impersonal","Un llenguatge arcaic cavalleresc"],"answer":"Popular i col·loquial, però literàriament estilitzada","explanation":"L’aparença de senzillesa conviu amb una gran expressivitat poètica.","source":"Apunts de narrativa, pàgina 9"},{"id":"r076","topic":"Personatges","page":9,"prompt":"Quina seqüència resumix l’evolució identitària de la protagonista?","options":["Natàlia, Colometa, Natàlia","Colometa, Rita, Griselda","Natàlia, Enriqueta, Colometa","Rita, Colometa, Natàlia"],"answer":"Natàlia, Colometa, Natàlia","explanation":"Els noms expressen innocència, alienació i recuperació de la identitat.","source":"Apunts de narrativa, pàgina 9"},{"id":"r077","topic":"Personatges","page":10,"prompt":"Quin model de masculinitat representa Quimet?","options":["Autoritari, dominant i patriarcal","Empàtic i contrari a la imposició","Deslligat de tota autoritat familiar","Idèntic al d’Antoni en tots els aspectes"],"answer":"Autoritari, dominant i patriarcal","explanation":"Quimet imposa formes de vida i una identitat sobre Natàlia.","source":"Apunts de narrativa, pàgina 10"},{"id":"r078","topic":"Personatges","page":10,"prompt":"Quin és l’ofici de Quimet?","options":["Fuster","Adroguer","Metge","Impressor"],"answer":"Fuster","explanation":"L’activitat de la fusteria també es vincula amb la precarietat familiar.","source":"Apunts de narrativa, pàgina 10"},{"id":"r079","topic":"Personatges","page":10,"prompt":"Quins objectes s’associen amb la masculinitat de Quimet?","options":["La motocicleta, la bandera i el fusell","El jardí, les balances i les nines","El quadre, la flor blava i el colomar buit","La caixa de llibres i el piano"],"answer":"La motocicleta, la bandera i el fusell","explanation":"Els apunts els interpreten com a símbols de força i de masculinitat hegemònica.","source":"Apunts de narrativa, pàgina 10"},{"id":"r080","topic":"Personatges","page":10,"prompt":"Quin model representa Antoni l’adroguer?","options":["Una convivència més respectuosa i empàtica","La reproducció exacta de les imposicions de Quimet","La total indiferència pels fills de Natàlia","La necessitat d’humiliar sempre Natàlia"],"answer":"Una convivència més respectuosa i empàtica","explanation":"El contrast entre els dos homes és central en la lectura dels rols de gènere.","source":"Apunts de narrativa, pàgina 10"},{"id":"r081","topic":"Personatges","page":10,"prompt":"Quina funció té la senyora Enriqueta?","options":["És confident, consellera i figura de suport maternal","És la mare biològica de Natàlia","És la rival amorosa de Rita","És la narradora externa omniscient"],"answer":"És confident, consellera i figura de suport maternal","explanation":"El personatge oferix suport en una vida marcada per la pèrdua de la mare.","source":"Apunts de narrativa, pàgina 10"},{"id":"r082","topic":"Personatges","page":10,"prompt":"Quin detall singular caracteritza la mare de Quimet?","options":["Penja cintes per la casa","Cria coloms al front","És la propietària de l’adrogueria","Viu tota la novel·la a Ginebra"],"answer":"Penja cintes per la casa","explanation":"Els apunts relacionen les cintes amb la seua idealització d’una filla.","source":"Apunts de narrativa, pàgina 10"},{"id":"r083","topic":"Personatges","page":10,"prompt":"Com s’anomenen els fills de Natàlia i Quimet?","options":["Antoni i Rita","Pere i Julieta","Mateu i Griselda","Vicenç i Enriqueta"],"answer":"Antoni i Rita","explanation":"Antoni fill també és anomenat Toni; no s’ha de confondre amb l’adroguer.","source":"Apunts de narrativa, pàgina 10"},{"id":"r084","topic":"Personatges","page":10,"prompt":"Quin contrast establixen els apunts entre Toni i Rita?","options":["Ell és més casolà i ella més aventurera","Ell vol viatjar i ella rebutja tot canvi","Tots dos tenen una personalitat idèntica","Rita no manifesta mai desitjos propis"],"answer":"Ell és més casolà i ella més aventurera","explanation":"El contrast mostra que els rols tradicionals no coincidixen necessàriament amb el sexe dels personatges.","source":"Apunts de narrativa, pàgina 10"},{"id":"r085","topic":"Personatges","page":10,"prompt":"Amb qui es casa Rita?","options":["Vicenç","Pere","Cintet","Mateu"],"answer":"Vicenç","explanation":"El casament de Rita forma part del pas dels fills a la vida adulta en el desenllaç.","source":"Apunts de narrativa, pàgina 10"},{"id":"r086","topic":"Personatges","page":10,"prompt":"Quina és l’amiga de Natàlia vinculada a les colònies d’infants refugiats?","options":["Julieta","Griselda","La mare de Quimet","Montserrat"],"answer":"Julieta","explanation":"Julieta esdevé miliciana i representa una figura femenina forta i independent.","source":"Apunts de narrativa, pàgina 10"},{"id":"r087","topic":"Personatges","page":10,"prompt":"Qui són Mateu i Cintet?","options":["Amics de Quimet afectats també per la guerra","Els dos fills de Natàlia","Dos crítics literaris de l’exili","Els editors de La plaça del Diamant"],"answer":"Amics de Quimet afectats també per la guerra","explanation":"Les seues històries amplien la dimensió col·lectiva de la pèrdua i de la violència.","source":"Apunts de narrativa, pàgina 10"},{"id":"r088","topic":"Espai i temps","page":11,"prompt":"Quina ciutat vertebra els espais de la novel·la?","options":["Barcelona","Ginebra","València","París"],"answer":"Barcelona","explanation":"L’espai urbà barceloní connecta l’experiència íntima amb el món popular i la història.","source":"Apunts de narrativa, pàgina 11"},{"id":"r089","topic":"Espai i temps","page":11,"prompt":"Quins barris tenen una presència destacada?","options":["Gràcia i Sant Gervasi","El Cabanyal i Russafa","Montmartre i Belleville","El Raval i la Barceloneta com a únics espais"],"answer":"Gràcia i Sant Gervasi","explanation":"Són els barris que els apunts destaquen en la geografia rodorediana de l’obra.","source":"Apunts de narrativa, pàgina 11"},{"id":"r090","topic":"Espai i temps","page":11,"prompt":"Quin lloc NO correspon a la geografia barcelonina de l’obra?","options":["El llac Léman","El Parc Güell","Els Jardinets de Gràcia","El carrer Montseny"],"answer":"El llac Léman","explanation":"El llac Léman remet a Ginebra i a la biografia de l’autora, no als espais de l’acció de la novel·la.","source":"Apunts de narrativa, pàgina 11"},{"id":"r091","topic":"Espai i temps","page":8,"prompt":"Com es viu predominantment el temps narratiu?","options":["De manera subjectiva, segons la memòria de Natàlia","Com un calendari amb data exacta en cada capítol","Sense cap pas del temps","Sempre en ordre invers i sense excepcions"],"answer":"De manera subjectiva, segons la memòria de Natàlia","explanation":"El temps interior té més pes que la datació documental constant.","source":"Apunts de narrativa, pàgina 8"},{"id":"r092","topic":"Espai i temps","page":7,"prompt":"Quina seqüència històrica acompanya la vida de Natàlia?","options":["Anys previs a la República, República, guerra i postguerra","Edat mitjana, Renaixement, Barroc i Il·lustració","Restauració, Transició i integració europea","Només els anys de la Primera Guerra Mundial"],"answer":"Anys previs a la República, República, guerra i postguerra","explanation":"La història col·lectiva i la trajectòria personal es reflectixen mútuament.","source":"Apunts de narrativa, pàgina 7"},{"id":"r093","topic":"Espai i temps","page":11,"prompt":"Quin espai quotidià contribuïx a evocar la vida popular?","options":["La plaça de vendre","Una estació espacial","Un palau imperial a Viena","Un campus universitari suís"],"answer":"La plaça de vendre","explanation":"Els mercats, les festes, els comerços i el carrer donen densitat al món de Natàlia.","source":"Apunts de narrativa, pàgina 11"},{"id":"r094","topic":"Estil i símbols","page":11,"prompt":"Quin recurs consistix a repetir abundantment la conjunció i?","options":["Polisíndeton","Asíndeton","Anàfora numèrica","Hipèrbaton obligatori"],"answer":"Polisíndeton","explanation":"La coordinació reiterada reforça la sensació de discurs oral.","source":"Apunts de narrativa, pàgina 11"},{"id":"r095","topic":"Estil i símbols","page":11,"prompt":"Quina funció tenen moltes repeticions?","options":["Emfatitzar emocions i reproduir l’oralitat","Eliminar el ritme del relat","Convertir l’obra en un text administratiu","Suprimir la subjectivitat"],"answer":"Emfatitzar emocions i reproduir l’oralitat","explanation":"La reiteració pot mostrar insistència, intensitat emocional i espontaneïtat aparent.","source":"Apunts de narrativa, pàgina 11"},{"id":"r096","topic":"Estil i símbols","page":11,"prompt":"Què poden suggerir els punts suspensius?","options":["Vacil·lació, pensament inacabat o confidència","Una demostració matemàtica conclosa","Una veu sempre omniscient","La inexistència d’emocions"],"answer":"Vacil·lació, pensament inacabat o confidència","explanation":"Els silencis i les interrupcions també formen part de la construcció de la veu.","source":"Apunts de narrativa, pàgina 11"},{"id":"r097","topic":"Estil i símbols","page":11,"prompt":"Quin efecte aporten les onomatopeies?","options":["Expressivitat i, de vegades, humor","Objectivitat científica absoluta","Una cronologia més precisa","La desaparició del món sonor"],"answer":"Expressivitat i, de vegades, humor","explanation":"La llengua recrea sons i reforça la vivacitat del discurs.","source":"Apunts de narrativa, pàgina 11"},{"id":"r098","topic":"Estil i símbols","page":12,"prompt":"Què simbolitzen inicialment els coloms?","options":["L’opressió i la invasió de l’espai vital de Natàlia","La independència econòmica absoluta","La manca de càrregues domèstiques","Una afició que ella ha triat lliurement"],"answer":"L’opressió i la invasió de l’espai vital de Natàlia","explanation":"Els animals i la maternitat formen una xarxa simbòlica de càrrega i alienació.","source":"Apunts de narrativa, pàgina 12"},{"id":"r099","topic":"Estil i símbols","page":12,"prompt":"Com canvia el sentit dels coloms al final?","options":["S’integren en la memòria transformada del passat","Perden qualsevol relació amb Natàlia","Esdevenen un símbol exclusiu del futur europeu","Es transformen en personatges narradors"],"answer":"S’integren en la memòria transformada del passat","explanation":"El record no conserva necessàriament el mateix significat que tingué l’experiència viscuda.","source":"Apunts de narrativa, pàgina 12"},{"id":"r100","topic":"Estil i símbols","page":12,"prompt":"Què representen les balances de l’escala?","options":["El desequilibri viscut i la busca d’equilibri","L’èxit comercial de Quimet","Una competició esportiva","La desaparició de la memòria"],"answer":"El desequilibri viscut i la busca d’equilibri","explanation":"La imatge permet llegir el contrast entre injustícia, subordinació i desig d’harmonia.","source":"Apunts de narrativa, pàgina 12"},{"id":"r101","topic":"Estil i símbols","page":12,"prompt":"Quin sentit té la forma de l’embut?","options":["Una vida que s’estreny amb dificultats creixents","L’expansió il·limitada de la llibertat","La narració omniscient de tota la ciutat","La igualtat ja assolida des del principi"],"answer":"Una vida que s’estreny amb dificultats creixents","explanation":"L’objecte fa visible una experiència progressiva d’ofec i d’angoixa.","source":"Apunts de narrativa, pàgina 12"},{"id":"r102","topic":"Estil i símbols","page":12,"prompt":"Amb què s’associa el jardí en l’univers de Rodoreda?","options":["Amb la infantesa i una dimensió simbòlica o mística","Només amb la producció agrícola","Exclusivament amb el poder militar","Amb la negació de qualsevol record"],"answer":"Amb la infantesa i una dimensió simbòlica o mística","explanation":"El món vegetal recupera una experiència originària i pot adquirir valors espirituals.","source":"Apunts de narrativa, pàgina 12"},{"id":"r103","topic":"Estil i símbols","page":12,"prompt":"Quina idea pot simbolitzar l’arbre?","options":["L’eternitat","La burocràcia","La industrialització","El vot polític"],"answer":"L’eternitat","explanation":"Els apunts destaquen una lectura mística del món vegetal.","source":"Apunts de narrativa, pàgina 12"},{"id":"r104","topic":"Estil i símbols","page":12,"prompt":"A quin autor remet la flor blava?","options":["Novalis","Franz Kafka","Joan Fuster","Alain Robbe-Grillet"],"answer":"Novalis","explanation":"La flor blava és un motiu romàntic que els apunts relacionen amb Novalis.","source":"Apunts de narrativa, pàgina 12"},{"id":"r105","topic":"Estil i símbols","page":12,"prompt":"Quins valors pot tindre el color vermell?","options":["La passió i la sang menstrual","La neutralitat impersonal","L’absència d’emocions","Únicament la riquesa econòmica"],"answer":"La passió i la sang menstrual","explanation":"La sensualitat i la corporalitat participen en la xarxa de símbols de l’obra.","source":"Apunts de narrativa, pàgina 12"},{"id":"r106","topic":"Estil i símbols","page":12,"prompt":"Què simbolitzen les nines de la casa dels hules?","options":["La infantesa i una representació de la feminitat","La guerra industrial","L’autoritat parlamentària","El retorn de la censura"],"answer":"La infantesa i una representació de la feminitat","explanation":"Els objectes quotidians poden carregar-se de significats íntims i socials.","source":"Apunts de narrativa, pàgina 12"},{"id":"r107","topic":"Estil i símbols","page":11,"prompt":"Segons els apunts, quin valor té el quadre de la senyora Enriqueta?","options":["Una imatge relacionada amb la igualtat entre homes i dones","La submissió com a ideal inqüestionable","La victòria militar de Quimet","Una negació de tots els símbols"],"answer":"Una imatge relacionada amb la igualtat entre homes i dones","explanation":"La interpretació dels apunts connecta el quadre amb les relacions entre els sexes.","source":"Apunts de narrativa, pàgina 11"},{"id":"r108","topic":"Estil i símbols","page":8,"prompt":"Quin sentit té escriure el nom a la porta de l’antiga casa?","options":["Separar-se simbòlicament de la identitat imposada i del passat","Recuperar la submissió a Quimet","Obrir una botiga amb un nom nou","Rebutjar definitivament el propi nom"],"answer":"Separar-se simbòlicament de la identitat imposada i del passat","explanation":"El gest participa en l’alliberament final de Natàlia.","source":"Apunts de narrativa, pàgina 8"},{"id":"r109","topic":"Estil i símbols","page":12,"prompt":"Quin recurs associa sensacions de sentits diferents?","options":["Sinestèsia","Polisíndeton","El·lipsi temporal","Narrador testimoni"],"answer":"Sinestèsia","explanation":"La sinestèsia contribuïx al caràcter sensorial i poètic del llenguatge.","source":"Apunts de narrativa, pàgina 12"},{"id":"r110","topic":"Estil i símbols","page":12,"prompt":"Quina figura presenta una exageració expressiva?","options":["Hipèrbole","Metonímia","El·lipsi","Enumeració neutra"],"answer":"Hipèrbole","explanation":"El lirisme s’alimenta de recursos que intensifiquen la percepció subjectiva.","source":"Apunts de narrativa, pàgina 12"},{"id":"r111","topic":"Estil i símbols","page":12,"prompt":"Qui va dirigir la versió cinematogràfica citada en els apunts?","options":["Francesc Betriu","Alfred Hitchcock","Luis Buñuel","Vicent Andrés Estellés"],"answer":"Francesc Betriu","explanation":"Betriu és el director de l’adaptació; Hitchcock apareix en els apunts com una comparació amb el motiu de les aus.","source":"Apunts de narrativa, pàgina 12"}],"verbs":[{"id":"v000","sentence":"Cada vesprada {llegisc} una estona.","tense":"Present","mode":"Indicatiu","aspect":"Imperfectiu","explanation":"Present d’indicatiu: situació actual, habitual o general, presentada sense un límit final. El verb principal és llegir (3a conjugació); la forma marcada correspon a la 1a persona del singular.","answer":"Present · Imperfectiu · Indicatiu · 3a conjugació · 1a persona del singular","prompt":"Cada vesprada llegisc una estona.","infinitive":"llegir","conjugation":"3","person":"1","personLabel":"1a persona del singular","conjugationLabel":"3a conjugació"},{"id":"v001","sentence":"Ara {escrivim} el resum.","tense":"Present","mode":"Indicatiu","aspect":"Imperfectiu","explanation":"Present d’indicatiu: situació actual, habitual o general, presentada sense un límit final. El verb principal és escriure (2a conjugació); la forma marcada correspon a la 1a persona del plural.","answer":"Present · Imperfectiu · Indicatiu · 2a conjugació · 1a persona del plural","prompt":"Ara escrivim el resum.","infinitive":"escriure","conjugation":"2","person":"4","personLabel":"1a persona del plural","conjugationLabel":"2a conjugació"},{"id":"v002","sentence":"Sempre {reconeix} els seus errors.","tense":"Present","mode":"Indicatiu","aspect":"Imperfectiu","explanation":"Present d’indicatiu: situació actual, habitual o general, presentada sense un límit final. El verb principal és reconéixer (2a conjugació); la forma marcada correspon a la 3a persona del singular.","answer":"Present · Imperfectiu · Indicatiu · 2a conjugació · 3a persona del singular","prompt":"Sempre reconeix els seus errors.","infinitive":"reconéixer","conjugation":"2","person":"3","personLabel":"3a persona del singular","conjugationLabel":"2a conjugació"},{"id":"v003","sentence":"Laia {té} dos germans.","tense":"Present","mode":"Indicatiu","aspect":"Imperfectiu","explanation":"Present d’indicatiu: situació actual, habitual o general, presentada sense un límit final. El verb principal és tindre (2a conjugació); la forma marcada correspon a la 3a persona del singular.","answer":"Present · Imperfectiu · Indicatiu · 2a conjugació · 3a persona del singular","prompt":"Laia té dos germans.","infinitive":"tindre","conjugation":"2","person":"3","personLabel":"3a persona del singular","conjugationLabel":"2a conjugació"},{"id":"v004","sentence":"Quan jo era menuda, {llegia} cada nit.","tense":"Imperfet","mode":"Indicatiu","aspect":"Imperfectiu","explanation":"L’imperfet presenta una situació passada en desenvolupament o habitual: aspecte imperfectiu. El verb principal és llegir (3a conjugació); la forma marcada correspon a la 1a persona del singular.","answer":"Imperfet · Imperfectiu · Indicatiu · 3a conjugació · 1a persona del singular","prompt":"Quan jo era menuda, llegia cada nit.","infinitive":"llegir","conjugation":"3","person":"1","personLabel":"1a persona del singular","conjugationLabel":"3a conjugació"},{"id":"v005","sentence":"Mentre nosal
